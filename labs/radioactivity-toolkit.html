<script>
/* ============================================================= *
 * ABSORPTION TAB  (namespace: abs)                              *
 * Fully self-contained. Models a G-M absorption bench with      *
 * Poisson counting statistics.                                  *
 * ============================================================= */
(function () {
  "use strict";

  /* ---- Coordinate scaling helper (DC Circuit Builder pattern) ---- */
  const canvasPoint = (canvas, clientX, clientY) => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * canvas.width / rect.width,
      y: (clientY - rect.top) * canvas.height / rect.height
    };
  };

  /* ---- Physics model -------------------------------------------------
     Count rate is built from first principles:

       count rate = Activity * solidAngleFraction(window, d+eps)
                    * intrinsicEfficiency(kind) * branching
                    * absorberTransmission(kind) * airFactor(kind, d+eps)

     where
       Activity   : decays/s of the source (school sources ~tens-hundreds kBq)
       solidAngle : fraction of 4pi the GM window subtends at the TRUE
                    source-detector separation x = d + eps. This is the
                    geometric inverse-square term; at bench distances it is
                    ~1/x^2, and it self-regularises near contact (no blow-up).
       eps        : fixed apparatus offset (source recessed behind its window
                    + detection volume recessed inside the tube). Measured on
                    our bench as 2 cm; students can recover it from a 1/sqrt(C)
                    vs d plot (x-intercept = -eps).
       efficiency : a GM tube counts ~95% of alphas / ~90% of betas that enter
                    the window, but only ~1% of gamma photons. This is why an
                    equally-active gamma source reads ~100x lower than alpha/beta.

     Calibration: window diameter and activity are chosen (35 mm window,
     ~76 kBq) so the simulated gamma rate matches real student data taken on
     our bench (Cs-137 class source: ~4 /s at d=10 cm, ~15 /s at d=4 cm).
     Window size cannot be derived from eps (independent quantities); it is a
     typical end-window-tube value, picked with activity to reproduce the
     measured gamma scale. The numbers are realistic ballpark figures, not a
     fit to individual points.

     Absorber transmission and air ranges are COMPUTED from real physics
     (see transmission() and airFactor()); alpha by range, beta by mass-
     thickness exponential (mu_m = 17*Emax^-1.43), gamma by NIST coefficients. */

  const BACKGROUND = 0.5;            // counts/s, always present
  const EPS_DEFAULT_CM = 2.0;        // apparatus offset, cm (default; the slider
                                     // varies state.epsCm from 0 to this value)
  // The geometric offset epsilon splits physically into air in front of the
  // source's active layer (which the alpha must cross) and detection depth
  // recessed inside the GM tube (behind the window - the alpha is caught at the
  // window, so this part is NOT air the alpha travels). The alpha's air path is
  // therefore (source-side air + the measured gap to whatever intercepts it),
  // NOT the full geometric separation. This does not affect the inverse-square
  // geometry (which uses the full combined offset) or the 1/sqrt(C) vs d offset
  // recovery (a combined value), only how far the alpha reaches. The slider
  // scales BOTH parts together: at epsilon = 0 the active layer sits at the
  // source window and detection happens at the tube window (idealised kit).
  const SRC_AIR_CM = 1.5;            // cm of air from the source's active layer
                                     // out to its window AT THE DEFAULT offset.
                                     // Scaled by (epsCm / EPS_DEFAULT_CM) so the
                                     // source-side recess follows the slider.
  const WINDOW_RADIUS_M = 0.0175;    // GM end-window radius (35 mm dia), assumed typical

  // Intrinsic detection efficiency of the GM tube per radiation kind.
  const EFFICIENCY = { alpha: 0.95, beta: 0.90, gamma: 0.01 };

  // Fraction of 4pi subtended by a circular window of radius a at distance x
  // (both metres). Omega = 2*pi*(1 - x/sqrt(x^2+a^2)); fraction = Omega/4pi.
  function solidAngleFraction(x_m) {
    const a = WINDOW_RADIUS_M;
    const omega = 2 * Math.PI * (1 - x_m / Math.sqrt(x_m * x_m + a * a));
    return omega / (4 * Math.PI);
  }

  // Absorber physical properties.
  const ABSORBERS = {
    none:   { label: 'None',      tag: 'none',  rho: 0,     t_cm: 0     },
    idpaper:{ label: 'Paper',     tag: 'paper', rho: 0.90,  t_cm: 0.012 }, // idealised (alpha-only)
    paper:  { label: 'Paper',     tag: 'paper', rho: 0.90,  t_cm: 0.012 }, // ~0.12 mm, real
    al:     { label: 'Aluminium', tag: 'al',    rho: 2.70,  t_cm: 0.30  }, // 3 mm
    al5:    { label: 'Aluminium', tag: 'al',    rho: 2.70,  t_cm: 5.0   }, // 5 cm (thick)
    pb:     { label: 'Lead',      tag: 'pb',    rho: 11.35, t_cm: 5.0   }  // 5 cm
  };
  function massThickness(absKey) {
    const a = ABSORBERS[absKey];
    return a.rho * a.t_cm;        // g/cm^2
  }

  const ABSORBER_LABEL = { none: 'None', idpaper: 'Paper (idealised)', paper: 'Paper (real)', al: 'Aluminium 3 mm', al5: 'Aluminium 5 cm', pb: 'Lead' };
  const ABSORBER_TAG   = { none: 'none', idpaper: 'paper', paper: 'paper', al: 'al', al5: 'al', pb: 'pb' };

  // Alpha range in g/cm^2 (~5 MeV alpha in unit-density material ~0.004).
  const ALPHA_RANGE = 0.004;

  // Beta mass attenuation coefficient from endpoint energy (cm^2/g).
  function betaMu(Emax) { return 17 * Math.pow(Emax, -1.43); }

  // Gamma mass attenuation coefficient (cm^2/g) for a photon energy (MeV),
  // per absorber. NIST-based anchor values, interpolated log-log in energy.
  // Tables: {energyMeV: mu_m} for paper(~C/water-like), al, pb.
  const GAMMA_MU_TABLE = {
    paper: [[0.06,0.18],[0.66,0.086],[1.25,0.063]],
    al:    [[0.06,0.28],[0.66,0.0745],[1.25,0.0573]],
    pb:    [[0.06,7.2],[0.66,0.118],[1.25,0.0589]]
  };
  function gammaMu(absKey, E) {
    if (absKey === 'none') return 0;
    const tbl = GAMMA_MU_TABLE[absKey];
    if (!tbl) return 0;
    if (E <= tbl[0][0]) return tbl[0][1];
    if (E >= tbl[tbl.length - 1][0]) return tbl[tbl.length - 1][1];
    for (let i = 0; i < tbl.length - 1; i++) {
      const [e0, m0] = tbl[i], [e1, m1] = tbl[i + 1];
      if (E >= e0 && E <= e1) {
        // log-log interpolation
        const f = (Math.log(E) - Math.log(e0)) / (Math.log(e1) - Math.log(e0));
        return Math.exp(Math.log(m0) + f * (Math.log(m1) - Math.log(m0)));
      }
    }
    return tbl[tbl.length - 1][1];
  }

  // Transmission of one component through an absorber, from real physics.
  function transmission(comp, absKey) {
    if (absKey === 'none') return 1;
    // Idealised paper: the textbook model - stops alpha completely, passes ALL
    // beta and gamma untouched (no soft-beta absorption). A deliberate teaching
    // idealisation; switch to real Paper to see the true partial beta absorption.
    if (absKey === 'idpaper') {
      return (comp.type === 'alpha') ? 0 : 1;
    }
    const xm = massThickness(absKey);
    if (comp.type === 'alpha') {
      return (xm > ALPHA_RANGE) ? 0 : 1;
    }
    if (comp.type === 'beta') {
      return Math.exp(-betaMu(comp.Emax) * xm);
    }
    if (comp.type === 'gamma') {
      return Math.exp(-gammaMu(absKey, comp.E) * xm);
    }
    return 1;
  }

  /* ---- Air path physics (distance) -----------------------------------
     Air is treated as a real absorbing medium: the radiation crosses a path
     of air whose mass thickness is rho_air * path_length, and each radiation
     obeys its own attenuation law on that mass thickness - exactly parallel
     to the solid-absorber treatment in transmission():

       alpha : definite RANGE (not exponential). Geiger relation
               R(cm) = 0.323 * E^1.5 in air. Detection falls smoothly to
               zero across a ~1 cm straggling shoulder centred on R (energy
               spread + range straggling), landing the cut-off in the
               textbook 3-5 cm band once the apparatus offset is included.
       beta  : EXPONENTIAL in air mass thickness, same mu_m = 17*Emax^-1.43
               cm^2/g as for solids. Soft betas (e.g. Co-60 0.318 MeV) are
               largely gone within tens of cm of air; hard betas (Y-90
               2.28 MeV) survive the whole bench. This is the energy-
               dependent reality behind the "~1 m in air" rule of thumb.
       gamma : EXPONENTIAL in air mass thickness with the real NIST air
               mass attenuation coefficient. The loss is sub-percent over a
               metre (air is nearly transparent to gamma), so geometry
               (inverse-square) dominates - but it is now computed, not
               assumed.

     x_cm is the true source-detector separation in centimetres. */
  const RHO_AIR = 0.001205;            // g/cm^3 (dry air, ~20 C)

  // NIST gamma mass attenuation coefficient for AIR (cm^2/g), log-log table.
  const GAMMA_MU_AIR = [[0.06,0.0287],[0.6,0.00805],[1.0,0.00636],[1.25,0.00569]];
  function gammaMuAir(E) {
    const t = GAMMA_MU_AIR;
    if (E <= t[0][0]) return t[0][1];
    if (E >= t[t.length-1][0]) return t[t.length-1][1];
    for (let i = 0; i < t.length-1; i++) {
      const [e0,m0] = t[i], [e1,m1] = t[i+1];
      if (E >= e0 && E <= e1) {
        const f = (Math.log(E)-Math.log(e0)) / (Math.log(e1)-Math.log(e0));
        return Math.exp(Math.log(m0) + f*(Math.log(m1)-Math.log(m0)));
      }
    }
    return t[t.length-1][1];
  }

  function alphaAirRange_cm(Ealpha) { return 0.323 * Math.pow(Ealpha, 1.5); }

  function airFactor(comp, x_cm, distance_cm) {
    if (comp.type === 'alpha') {
      // The alpha crosses the source-side air plus the measured gap to the
      // detector - the tube-side recess is behind the window and is not air
      // the alpha travels through. The source-side air scales with the
      // offset slider: at epsilon = 0 the active layer sits at the window.
      const airPath = SRC_AIR_CM * (state.epsCm / EPS_DEFAULT_CM) + distance_cm;
      const R = alphaAirRange_cm(comp.Ealpha);
      const straggle = 0.5;                 // cm, half-width of the fall-off
      if (airPath <= R - straggle) return 1;
      if (airPath >= R + straggle) return 0;
      const f = (airPath - (R - straggle)) / (2 * straggle);
      return 0.5 * (1 + Math.cos(Math.PI * f));  // smooth cosine shoulder 1 -> 0
    }
    if (comp.type === 'beta') {
      // exponential in air mass thickness, same mu_m as solids
      const xm = RHO_AIR * x_cm;            // g/cm^2 of air
      return Math.exp(-betaMu(comp.Emax) * xm);
    }
    if (comp.type === 'gamma') {
      // exponential in air mass thickness with NIST air coefficient (tiny loss)
      const xm = RHO_AIR * x_cm;
      return Math.exp(-gammaMuAir(comp.E) * xm);
    }
    return 1;
  }

  /* Source catalogue: REAL isotopes with REAL emissions and energies.
     A sample emits what its nuclide (plus any in-grown daughters) produces.
     'emit' is the kind set used for the reveal chips; 'components' carries
     the physics (each with its energy). 'activity' is in becquerel (decays/s)
     at realistic school-source levels. Each component carries an intensity
     'I' = the number of that particle/photon emitted per decay (branching);
     defaults to 1. Multi-emitters are justified by real nuclear physics:
     a de-excitation gamma accompanying a decay, a sealed-source capsule
     absorbing the beta, or an in-grown daughter chain within the sample. */
  const SOURCES = [
    { id: 'none', name: 'No source (background)', short: 'No source', activity: 0, emit: [], components: [] },
    { id: 'po210', name: 'Polonium-210', short: 'Po-210', activity: 80000, emit: ['alpha'],
      components: [{ type: 'alpha', Ealpha: 5.30, I: 1.0 }] },
    { id: 'sr90', name: 'Strontium-90', short: 'Sr-90', activity: 75000, emit: ['beta'],
      // pure beta sample: Sr-90 (0.546) + in-grown Y-90 daughter (2.28), both beta-, no gamma
      components: [{ type: 'beta', Emax: 0.546, I: 1.0 }, { type: 'beta', Emax: 2.28, I: 1.0 }] },
    { id: 'cs137', name: 'Caesium-137 (sealed)', short: 'Cs-137', activity: 76000, emit: ['gamma'],
      // sealed source: beta absorbed by capsule; useful output is the 0.662 MeV gamma (85% per decay, via Ba-137m)
      components: [{ type: 'gamma', E: 0.662, I: 0.85 }] },
    { id: 'am241', name: 'Americium-241', short: 'Am-241', activity: 80000, emit: ['alpha', 'gamma'],
      // 5.49 MeV alpha (100%), plus a low-intensity 59.5 keV gamma (~36% per decay)
      components: [{ type: 'alpha', Ealpha: 5.49, I: 1.0 }, { type: 'gamma', E: 0.0595, I: 0.36 }] },
    { id: 'co60', name: 'Cobalt-60', short: 'Co-60', activity: 76000, emit: ['beta', 'gamma'],
      // beta- 0.318 MeV (100%), two gammas 1.17 & 1.33 MeV (each ~100% per decay)
      components: [{ type: 'beta', Emax: 0.318, I: 1.0 }, { type: 'gamma', E: 1.17, I: 1.0 }, { type: 'gamma', E: 1.33, I: 1.0 }] },
    { id: 'ra226', name: 'Radium-226 (+ daughters)', short: 'Ra-226', activity: 80000, emit: ['alpha', 'beta', 'gamma'],
      // chain-in-sample at secular equilibrium: alphas (Ra/Rn/Po, several per chain),
      // beta- (Pb-214/Bi-214), gamma (Bi-214 ~0.609 MeV ~45% per decay)
      components: [{ type: 'alpha', Ealpha: 4.87, I: 3.0 }, { type: 'beta', Emax: 1.51, I: 2.0 }, { type: 'gamma', E: 0.609, I: 0.45 }] },
    { id: 'pa234m', name: 'Protactinium-234m (freshly separated)', short: 'Pa-234m', activity: 90000, emit: ['beta'],
      // SHORT-LIVED beta source for the half-life experiment. Accepted half-life
      // of Pa-234m is 1.159(11) min = 69.5 s (the precise measured value; often
      // rounded to ~70 s / 1.17 min in textbooks). Only offered in 'Count rate
      // vs time' mode; decays during a timed run. Pure beta- (Emax ~2.29 MeV).
      decaying: true, halfLife_s: 69.5,
      components: [{ type: 'beta', Emax: 2.29, I: 1.0 }] }
  ];

  /* Mean count rate (counts/s) for a source at the current distance through
     the current absorber, built from first principles and summed over the
     source's physical components. distance_cm is the MEASURED source-detector
     separation (the apparatus offset eps is added to get the true path). */
  /* Mean (expected) counts accumulated over one gate, accounting for decay
     DURING the gate. For a constant source this is just rate * gate. For a
     decaying source the rate falls across the gate, so the true accumulated
     count is the integral of R0*exp(-lambda*t) over the gate:
         N = (Rstart / lambda) * (1 - exp(-lambda*T))
     evaluated from the current decay clock. This is exactly what the tube
     records; a Poisson sample is then drawn around it for real statistics. */
  function gateMeanCounts(source, absorberKey, distance_cm, gate_s) {
    const rateNow = meanRate(source, absorberKey, distance_cm);   // at gate start
    if (!source.decaying) return rateNow * gate_s;
    const lambda = Math.LN2 / source.halfLife_s;
    if (lambda <= 0) return rateNow * gate_s;
    // background is constant (not decaying) - separate it out
    const rateSignal = rateNow - BACKGROUND;                      // decaying part at gate start
    const signalCounts = (rateSignal / lambda) * (1 - Math.exp(-lambda * gate_s));
    const bgCounts = BACKGROUND * gate_s;
    return signalCounts + bgCounts;
  }

  /* Effective activity now. For a decaying source (Pa-234m) the activity falls
     as A0 * exp(-lambda * t) where t is the physics time since the timed run
     started; lambda = ln2 / halfLife. Constant sources return A0 unchanged. */
  function effectiveActivity(source) {
    if (source.decaying) {
      const lambda = Math.LN2 / source.halfLife_s;
      return source.activity * Math.exp(-lambda * state.decayElapsed);
    }
    return source.activity;
  }

  function meanRate(source, absorberKey, distance_cm) {
    let r = BACKGROUND;
    if (!source.components.length) return r;
    const x_cm = distance_cm + state.epsCm;           // true separation, cm
    const x_m  = x_cm / 100;                          // true separation, m
    const geom = solidAngleFraction(x_m);             // fraction of 4pi at the window
    const A = effectiveActivity(source);              // decay-adjusted activity
    for (const c of source.components) {
      const eff = EFFICIENCY[c.type] || 0;
      const I   = (typeof c.I === 'number') ? c.I : 1;   // particles/photons per decay
      r += A * I * geom * eff
           * transmission(c, absorberKey)               // solid-absorber attenuation
           * airFactor(c, x_cm, distance_cm);            // air range / air attenuation
    }
    return r;
  }

  /* ---- Poisson sampling ----------------------------------------------
     Knuth's algorithm for small means; normal approximation for large
     means (mean > 30) to stay fast and avoid underflow over long gates. */
  function poisson(mean) {
    if (mean <= 0) return 0;
    if (mean < 30) {
      const L = Math.exp(-mean);
      let k = 0, p = 1;
      do { k++; p *= Math.random(); } while (p > L);
      return k - 1;
    }
    // Normal approximation, rounded, clamped at 0.
    const g = gaussian() * Math.sqrt(mean) + mean;
    return Math.max(0, Math.round(g));
  }
  let _spare = null;
  function gaussian() {
    if (_spare !== null) { const s = _spare; _spare = null; return s; }
    let u, v, s;
    do { u = Math.random() * 2 - 1; v = Math.random() * 2 - 1; s = u * u + v * v; }
    while (s >= 1 || s === 0);
    const mul = Math.sqrt(-2 * Math.log(s) / s);
    _spare = v * mul;
    return u * mul;
  }

  /* ---- State ---- */
  /* ---- Bench geometry (physical) ----------------------------------
     The bench maps a real distance in cm to canvas pixels at a fixed
     scale, so dragging the detector twice as far really doubles the
     recorded distance. Source and detector each have a cm position
     measured from the left datum; distance = detector - source. */
  const CM_MIN = 2, CM_MAX = 44;          // allowed source->detector range
  const PX_PER_CM = 22;                   // canvas px per cm (fixed scale)
  const LEFT_DATUM_PX = 110;              // x-pixel of cm = 0 (source travel origin)

  const state = {
    sourceId: 'am241',
    absorber: 'none',
    srcCm: 6,          // source position (cm from datum)
    detCm: 18,         // detector position (cm from datum); distance = detCm - srcCm
    absCm: 12,         // absorber position (cm from datum); free between src & det
    gate: 100,         // s
    epsCm: EPS_DEFAULT_CM, // apparatus offset (cm); slider-set, locked while readings exist
    speed: 1,          // playback multiplier; 0 = instant
    mode: 'single',    // 'single' | 'time' (measurement mode)
    readings: 12,      // number of readings in a time-series run
    decayElapsed: 0,   // s of physics time elapsed for a decaying source (time mode)
    rateUnit: 's',     // s | min | hr
    revealed: false,
    running: false,
    displayCount: 0,   // number currently shown on the detector device window
    live: false,       // monitor (live) mode: free-running counter, not logged
    liveCount: 0,      // free-running accumulated count in monitor mode
    liveLastT: 0,      // timestamp for live accumulation
    gateElapsed: 0,    // s of gate elapsed (for canvas gate panel)
    gateTotal: 100,    // s total gate (for canvas gate panel)
    gateFrac: 0,       // 0..1 progress (for canvas gate panel)
    rows: []           // {n, sourceName, distance, absorber, gate, counts, rate, isBackground}
  };
  let rowCounter = 0;

  function currentDistance() { return state.detCm - state.srcCm; }

  /* ---- DOM ---- */
  const bench      = document.getElementById('absBench');
  const ctx        = bench.getContext('2d');
  const sourceSel  = document.getElementById('absSourceSel');
  const absorberSel= document.getElementById('absAbsorberSel');
  const gateSel    = document.getElementById('absGateSel');
  const speedSeg   = document.getElementById('absSpeedSeg');
  const unitSeg    = document.getElementById('absUnitSeg');
  const runBtn     = document.getElementById('absRunBtn');
  const clearBtn   = document.getElementById('absClearBtn');
  const revealBtn  = document.getElementById('absRevealBtn');
  const soundBtn   = document.getElementById('absSoundBtn');
  const epsSlider  = document.getElementById('absEpsSlider');
  const epsVal     = document.getElementById('absEpsVal');

  /* Apparatus offset slider. Locked while any readings exist so a dataset
     can never mix two different geometries; Clear unlocks it. */
  epsSlider.addEventListener('input', () => {
    state.epsCm = parseFloat(epsSlider.value);
    epsVal.textContent = state.epsCm.toFixed(1) + ' cm';
  });

  function updateEpsEnabled() {
    const locked = state.rows.length > 0;
    epsSlider.disabled = locked;
    epsSlider.style.opacity = locked ? 0.4 : 1;
    epsVal.style.opacity = locked ? 0.55 : 1;
  }
  const revealCont = document.getElementById('absRevealContent');
  const tableBody  = document.getElementById('absTableBody');
  const rateHeader = document.getElementById('absRateHeader');
  const adjHeader  = document.getElementById('absAdjHeader');

  /* ---- Populate source dropdown ---- */
  function populateSources() {
    let html = '';
    const timeMode = (state.mode === 'time');
    for (let i = 0; i < SOURCES.length; i++) {
      const s = SOURCES[i];
      // Time mode is the decay experiment: offer ONLY the decaying source
      // (Pa-234m). Background is captured automatically at the start of a run,
      // and steady-source variability is shown by repeating a single reading,
      // so constant sources and 'No source' are not needed here.
      // Single mode offers everything EXCEPT the decaying source (a single
      // reading of a fast-decaying source is meaningless).
      if (timeMode) {
        if (!s.decaying) continue;
      } else {
        if (s.decaying) continue;
      }
      html += '<option value="' + s.id + '">' + s.name + '</option>';
    }
    sourceSel.innerHTML = html;
    // Snap to a valid source for the mode if the current one isn't offered.
    if (!sourceSel.querySelector('option[value="' + state.sourceId + '"]')) {
      state.sourceId = timeMode ? 'pa234m' : 'am241';
    }
    sourceSel.value = state.sourceId;
  }
  populateSources();

  /* Gate options depend on the selected source. A fast-decaying source
     (Pa-234m, ~72 s) only makes sense with SHORT gates - a long gate would
     count for longer than the source survives - so it is offered 5/10/20/30 s.
     Constant sources keep the full range (up to long gates for weak/distant
     signals). The current gate is preserved if still valid, else snapped to a
     sensible default. */
  const GATES_DECAYING = [5, 10, 20, 30];
  const GATES_CONSTANT = [10, 30, 60, 100, 300, 600, 1000];
  function populateGates() {
    const src = currentSource();
    const list = (src && src.decaying) ? GATES_DECAYING : GATES_CONSTANT;
    let html = '';
    for (let i = 0; i < list.length; i++) {
      html += '<option value="' + list[i] + '">' + list[i] + ' s</option>';
    }
    gateSel.innerHTML = html;
    if (list.indexOf(state.gate) === -1) {
      state.gate = (src && src.decaying) ? 10 : 100;
    }
    gateSel.value = String(state.gate);
  }
  populateGates();

  function currentSource() {
    for (let i = 0; i < SOURCES.length; i++) {
      if (SOURCES[i].id === state.sourceId) return SOURCES[i];
    }
    return SOURCES[0];
  }

  /* ---- Reveal panel ---- */
  function renderReveal() {
    if (!state.revealed) {
      revealCont.innerHTML = '<span class="hidden-q">hidden</span>';
      revealBtn.textContent = 'Reveal';
      return;
    }
    const src = currentSource();
    if (src.emit.length === 0) {
      revealCont.innerHTML = '<span class="chip none">background only</span>';
    } else {
      let html = '';
      if (src.emit.indexOf('alpha') >= 0) html += '<span class="chip a">&alpha;</span>';
      if (src.emit.indexOf('beta')  >= 0) html += '<span class="chip b">&beta;</span>';
      if (src.emit.indexOf('gamma') >= 0) html += '<span class="chip g">&gamma;</span>';
      revealCont.innerHTML = html;
    }
    revealBtn.textContent = 'Hide';
  }

  /* ---- Rate unit conversion ---- */
  function rateInUnit(counts, gate) {
    const perSec = counts / gate;
    if (state.rateUnit === 'min') return perSec * 60;
    if (state.rateUnit === 'hr')  return perSec * 3600;
    return perSec;
  }
  function formatRate(v) {
    // Sensible significant figures for projection.
    if (v >= 1000) return Math.round(v).toLocaleString();
    if (v >= 10)   return v.toFixed(0);
    if (v >= 1)    return v.toFixed(1);
    return v.toFixed(2);
  }
  // Signed version for the adjusted column: corrected rates can be slightly
  // negative near background (real Poisson scatter), shown honestly.
  function formatRateSigned(v) {
    const sign = (v < 0) ? '\u2212' : '';     // proper minus glyph
    const a = Math.abs(v);
    let body;
    if (a >= 1000) body = Math.round(a).toLocaleString();
    else if (a >= 10) body = a.toFixed(0);
    else if (a >= 1)  body = a.toFixed(1);
    else body = a.toFixed(2);
    return sign + body;
  }
  function rateHeaderText() {
    if (state.rateUnit === 'min') return 'Count rate / min\u207b\u00b9';
    if (state.rateUnit === 'hr')  return 'Count rate / hr\u207b\u00b9';
    return 'Count rate / s\u207b\u00b9';
  }

  /* ---- Results table ---- */
  function renderTable() {
    rateHeader.innerHTML = rateHeaderText();
    adjHeader.innerHTML = 'Adjusted ' + rateHeaderText().toLowerCase();
    if (state.rows.length === 0) {
      tableBody.innerHTML = '<tr class="empty-row"><td colspan="9">No runs yet &mdash; press Run to take a measurement.</td></tr>';
      return;
    }
    const bg = backgroundEstimate();   // counts/s, or null
    let html = '';
    for (let i = 0; i < state.rows.length; i++) {
      const r = state.rows[i];
      const isLast = (i === state.rows.length - 1);
      const tag = ABSORBER_TAG[r.absorber];
      const rate = formatRate(rateInUnit(r.counts, r.gate));
      // Adjusted = source rate minus background estimate. Not meaningful for
      // background runs (that IS the background), or before any background
      // has been measured. Honest sign: may be slightly negative near bg.
      let adj;
      if (r.isBackground || bg === null) {
        adj = '&mdash;';
      } else {
        const corrPerSec = r.rate - bg;             // counts/s, may be < 0
        const corr = (state.rateUnit === 'min') ? corrPerSec * 60
                   : (state.rateUnit === 'hr')  ? corrPerSec * 3600
                   : corrPerSec;
        adj = formatRateSigned(corr);
      }
      // Time column: cumulative seconds for timed-series rows, dash for singles.
      const timeCell = (typeof r.tMid === 'number') ? r.tMid.toFixed(0) : '&mdash;';
      html +=
        '<tr class="' + (isLast ? 'latest' : '') + '">' +
        '<td>' + r.n + '</td>' +
        '<td>' + r.sourceName + '</td>' +
        '<td>' + r.distance.toFixed(1) + ' cm</td>' +
        '<td class="abs-col"><span class="tbl-tag ' + tag + '">' + ABSORBER_LABEL[r.absorber] + '</span></td>' +
        '<td>' + r.gate + ' s</td>' +
        '<td>' + timeCell + '</td>' +
        '<td>' + r.counts.toLocaleString() + '</td>' +
        '<td>' + rate + '</td>' +
        '<td>' + adj + '</td>' +
        '</tr>';
    }
    tableBody.innerHTML = html;
  }

  function logRow(counts, tMid) {
    rowCounter++;
    const src = activeSource();
    const isBackground = (src.id === 'none');   // background measured only with no source
    state.rows.push({
      n: rowCounter,
      sourceName: src.name,
      distance: Math.round(currentDistance() * 10) / 10,
      absorber: state.absorber,
      gate: state.gate,
      counts: counts,
      rate: counts / state.gate,                // counts/s for this run
      isBackground: isBackground,
      tMid: (typeof tMid === 'number') ? tMid : null   // time stamp (s) for series rows
    });
    renderTable();
    updateEpsEnabled();                       // lock the offset slider while data exists
    // Update graph availability and live-refresh an open graphs window.
    if (typeof updateGraphsAvailability === 'function') updateGraphsAvailability();
    if (graphsWindow && graphsWindow.classList.contains('open')) { populateGraphPresets(); drawGraphsWindow(); }
    // Scroll newest row into view.
    const wrap = tableBody.parentElement.parentElement;
    if (wrap) wrap.scrollTop = wrap.scrollHeight;
  }

  /* Pooled background estimate from all no-source runs taken so far:
     total counts / total time (counts/s). Time-weighted, so a long background
     run counts for more than a short one - the statistically correct pooling
     for Poisson counts. Returns { rate, sigma, counts, time } or null if no
     background run has been logged yet. sigma = sqrt(total counts)/total time. */
  function backgroundStats() {
    let sumN = 0, sumT = 0;
    for (let i = 0; i < state.rows.length; i++) {
      if (state.rows[i].isBackground) { sumN += state.rows[i].counts; sumT += state.rows[i].gate; }
    }
    if (sumT <= 0) return null;
    return { rate: sumN / sumT, sigma: Math.sqrt(sumN) / sumT, counts: sumN, time: sumT };
  }

  function backgroundEstimate() {
    const s = backgroundStats();
    return s ? s.rate : null;
  }

  /* ---- Counter readout: count shown on the detector device window;
     gate label + progress are drawn on the bench canvas (see drawGatePanel). ---- */
  function setCounter(counts, elapsedGate, totalGate, finished) {
    state.displayCount = counts;
    state.gateElapsed = elapsedGate;
    state.gateTotal = totalGate;
    state.gateFrac = finished ? 1 : (totalGate > 0 ? Math.min(1, elapsedGate / totalGate) : 0);
    drawBench();
  }

  /* ---- Geiger click audio (Web Audio, self-contained) ----------------
     Synthesises the characteristic random clicking of a ratemeter. Clicks
     are scheduled as a Poisson process at the live DISPLAYED count rate, so
     a weak source gives sparse ticks and a strong source a dense crackle;
     above an audible cap the clicks merge into continuous noise, exactly as
     a real Geiger counter does. No external audio files - each click is a
     short synthesised noise burst. Respects the Sound on/off toggle. */
  const geiger = (function () {
    let ctx = null;
    let enabled = true;
    let running = false;
    let nextClickT = 0;          // scheduling clock (audio time)
    let timer = null;
    let liveRate = 0;            // counts/s currently being "heard"
    const MAX_CLICK_RATE = 70;   // audible cap; above this -> crackle/merge

    function ensureCtx() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    // One short click: filtered noise burst with a fast decay envelope.
    function click(when, gain) {
      if (!ctx) return;
      const dur = 0.012;
      const n = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, n, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        const env = Math.pow(1 - i / n, 3);     // sharp decay
        d[i] = (Math.random() * 2 - 1) * env;
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.8;
      const g = ctx.createGain();
      g.gain.value = gain;
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(when);
      src.stop(when + dur);
    }

    // Scheduler: look ahead ~120 ms and place clicks as a Poisson process at
    // the (capped) live rate. Runs on a short interval timer.
    function schedule() {
      if (!running || !enabled || !ctx) return;
      const horizon = ctx.currentTime + 0.12;
      const effRate = Math.min(liveRate, MAX_CLICK_RATE);
      // softer clicks when very dense so the crackle doesn't clip
      const gain = effRate > 40 ? 0.18 : 0.32;
      if (effRate <= 0) { nextClickT = ctx.currentTime; return; }
      while (nextClickT < horizon) {
        if (nextClickT > ctx.currentTime) click(nextClickT, gain);
        // exponential inter-arrival time -> Poisson clicks
        const u = Math.random();
        nextClickT += -Math.log(1 - u) / effRate;
      }
    }

    return {
      setEnabled(on) {
        enabled = on;
        if (!on && timer) { clearInterval(timer); timer = null; }
        if (on && running) this._startTimer();
      },
      isEnabled() { return enabled; },
      _startTimer() {
        if (timer) return;
        timer = setInterval(schedule, 50);
      },
      start() {
        if (!enabled) return;
        if (!ensureCtx()) return;
        running = true;
        nextClickT = ctx.currentTime;
        this._startTimer();
      },
      // live count rate the ear should hear (already speed-scaled by caller)
      setRate(r) { liveRate = (r > 0) ? r : 0; },
      stop() {
        running = false;
        liveRate = 0;
        if (timer) { clearInterval(timer); timer = null; }
      }
    };
  })();

  /* ---- Run cycle ----
     A measurement is one or more gated readings. 'Single reading' mode takes
     one. 'Count rate vs time' mode takes state.readings back-to-back readings,
     advancing the decay clock by one gate between them and logging each with a
     mid-interval time stamp, so a decaying source (Pa-234m) traces a real decay
     curve and constant sources show a flat, fluctuating line. */
  let runAnim = null;
  let _series = null;   // active time-series controller, or null

  function startRun() {
    if (state.running) return;
    if (state.live) { state.live = false; geiger.stop(); }

    if (state.mode === 'time') {
      // A timed run is one self-contained experiment (background + decay series).
      // Clear any existing rows first so the table and graph show only this run
      // - mixing in old readings would corrupt the fit and the half-life.
      state.rows = [];
      rowCounter = 0;
      renderTable();
      updateGraphsAvailability();
      if (graphsWindow.classList.contains('open')) drawGraphsWindow();
      // A timed run opens with ONE background gate measured with the source
      // absent (you measure background before the source is introduced - you
      // cannot measure it with an active, decaying source in place). After the
      // background gate the source is "freshly separated" and the decay series
      // begins from a zeroed decay clock.
      state.decayElapsed = 0;
      _series = { i: 0, n: state.readings, bg: true };
    } else {
      _series = null;
    }
    beginReading();
  }

  /* The source in play for the current gate: during a timed run's opening
     background gate the source is absent, so the tube sees background only. */
  function activeSource() {
    if (_series && _series.bg) return SOURCES[0];   // 'none' (background)
    return currentSource();
  }

  function beginReading() {
    state.running = true;
    runBtn.disabled = true;
    runBtn.textContent = (_series && _series.bg)
      ? 'Background\u2026'
      : (_series
          ? ('Reading ' + (_series.i + 1) + ' of ' + _series.n + '\u2026')
          : 'Counting\u2026');
    lockControls(true);

    const src = activeSource();
    const totalGate = state.gate;
    const gateStartDecay = state.decayElapsed;   // decay clock at the start of this gate

    if (state.speed === 0) {
      // Instant: the genuine accumulated count over the whole gate (decay
      // integrated across the gate for a decaying source), Poisson-sampled.
      const finalCounts = poisson(gateMeanCounts(src, state.absorber, currentDistance(), totalGate));
      setCounter(finalCounts, totalGate, totalGate, true);
      readingDone(finalCounts);
      return;
    }

    const rate0 = meanRate(src, state.absorber, currentDistance());  // at gate start (for sound)
    geiger.start();
    geiger.setRate(rate0 * state.speed);

    let physElapsed = 0, counts = 0, lastNow = performance.now();
    function frame(now) {
      if (!state.running) return;
      const dtReal = (now - lastNow) / 1000;
      lastNow = now;
      let dtPhys = dtReal * state.speed;
      if (physElapsed + dtPhys > totalGate) dtPhys = totalGate - physElapsed;
      if (dtPhys > 0) {
        // Advance the decay clock WITHIN the gate so the rate falls across it
        // (a decaying source visibly slows even during one reading). For a
        // constant source this is just the steady rate.
        state.decayElapsed = gateStartDecay + physElapsed + dtPhys / 2;  // midpoint of this step
        const rNow = meanRate(src, state.absorber, currentDistance());
        counts += poisson(rNow * dtPhys);
        physElapsed += dtPhys;
        geiger.setRate(rNow * state.speed);
      }
      const done = physElapsed >= totalGate - 1e-9;
      setCounter(counts, physElapsed, totalGate, done);
      drawBench();
      if (!done) { runAnim = requestAnimationFrame(frame); }
      else {
        state.decayElapsed = gateStartDecay;   // restore; readingDone advances by full gate
        readingDone(counts);
      }
    }
    runAnim = requestAnimationFrame(frame);
  }

  // One reading finished: log it (with a time stamp if in a series), then either
  // advance the series to the next reading or finish.
  function readingDone(finalCounts) {
    geiger.stop();
    setCounter(finalCounts, state.gate, state.gate, true);

    if (_series && _series.bg) {
      // Opening background gate just finished: log it as a background row (no
      // time stamp - it sits before the decay clock starts), then the source is
      // freshly separated and the decay series begins from t = 0.
      logRow(finalCounts);
      _series.bg = false;
      state.decayElapsed = 0;
      if (state.speed === 0) { beginReading(); }
      else { setTimeout(beginReading, 120); }
      return;
    }

    if (_series) {
      // Time stamp at the MIDPOINT of this counting interval (best estimate of
      // the time the mean rate applies to): i*gate + gate/2.
      const tMid = _series.i * state.gate + state.gate / 2;
      logRow(finalCounts, tMid);
      _series.i++;
      // advance the decay clock by one full gate for the next reading
      state.decayElapsed += state.gate;
      if (_series.i < _series.n) {
        if (state.speed === 0) { beginReading(); }
        else { setTimeout(beginReading, 120); }
        return;
      }
      _series = null;
    } else {
      logRow(finalCounts);
    }
    finishRun();
  }

  function finishRun() {
    state.running = false;
    state.decayElapsed = 0;
    runBtn.disabled = false;
    runBtn.textContent = (state.mode === 'time') ? 'Start' : 'Run';
    lockControls(false);
    drawBench();
  }

  function lockControls(lock) {
    // Source, absorber and gate define the measurement and must not change
    // mid-run. Speed is playback-only (it does not affect the physics), so it
    // stays live - the teacher can speed up or slow down a count in progress.
    sourceSel.disabled = lock;
    absorberSel.disabled = lock;
    gateSel.disabled = lock;
    if (readingsInput) readingsInput.disabled = lock;
    const modeBtns = modeSeg ? modeSeg.querySelectorAll('button') : [];
    for (let i = 0; i < modeBtns.length; i++) modeBtns[i].disabled = lock;
  }

  /* ============================================================= *
   * Bench drawing  (geometry-driven; no radiation animation so the *
   * apparatus gives nothing away)                                  *
   * ============================================================= */

  // Vertical layout constants
  function benchSurfaceY() { return bench.height * 0.70; }
  function deviceMidY()    { return bench.height * 0.44; }

  // cm -> canvas x
  function cmToX(cm) { return LEFT_DATUM_PX + cm * PX_PER_CM; }

  // Handle hit regions (computed each draw, used by drag code)
  let _srcHandle = { x: 0, y: 0, r: 26 };
  let _detHandle = { x: 0, y: 0, r: 30 };
  let _absHandle = null;
  let _absHandleY = 0;
  let _liveToggle = null;

  function drawBench() {
    const W = bench.width, H = bench.height;
    ctx.clearRect(0, 0, W, H);

    const benchY = benchSurfaceY();
    const midY = deviceMidY();

    // Bench surface
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, benchY, W, H - benchY);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, benchY); ctx.lineTo(W, benchY); ctx.stroke();

    const src = currentSource();
    const srcX = cmToX(state.srcCm);
    const detX = cmToX(state.detCm);
    // Keep the absorber within the beam, respecting solid edges.
    if (state.absorber !== 'none') {
      const lo = absMinCm();   // flush against source allowed
      const hi = absMaxCm();
      if (lo <= hi) {
        if (state.absCm < lo) state.absCm = lo;
        if (state.absCm > hi) state.absCm = hi;
      } else {
        state.absCm = (state.srcCm + state.detCm) / 2;
      }
    }
    const absX = cmToX(state.absCm);   // absorber freely positioned in the beam

    // Beam baseline (faint guide, no moving marks)
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.setLineDash([2, 6]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(srcX + 14, midY); ctx.lineTo(detX, midY); ctx.stroke();
    ctx.setLineDash([]);

    drawAbsorber(absX, midY, benchY);
    drawSource(srcX, midY, benchY, src);
    drawDetector(detX, midY, benchY);
    drawDistanceDim(srcX, detX, benchY);
    drawGatePanel();

    _srcHandle = { x: srcX, y: midY, r: 26 };
    _detHandle = { x: detX, y: midY, r: 30 };
    _absHandle = (state.absorber === 'none') ? null : { x: absX, y: _absHandleY, r: 18 };
  }

  /* Gate label + progress bar, drawn top-left on the canvas (replaces the
     old HTML gate panel to save vertical space). */
  function drawGatePanel() {
    const x = 22, y = 20, w = 150, h = 54;
    // panel
    ctx.fillStyle = 'rgba(10,18,32,0.66)';
    ctx.strokeStyle = 'rgba(52,211,153,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 8); else ctx.rect(x, y, w, h);
    ctx.fill(); ctx.stroke();
    // label
    ctx.fillStyle = '#9fd9c2';
    ctx.font = '600 10px -apple-system,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('GATE', x + 12, y + 17);
    // elapsed / total
    ctx.fillStyle = '#e6f1ec';
    ctx.font = '600 15px -apple-system,sans-serif';
    ctx.fillText(state.gateElapsed.toFixed(1) + ' / ' + state.gateTotal.toFixed(0) + ' s', x + 12, y + 35);
    // progress track + fill
    const tx = x + 12, ty = y + 44, tw = w - 24, th = 5;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(tx, ty, tw, th, 3); else ctx.rect(tx, ty, tw, th);
    ctx.fill();
    ctx.fillStyle = '#34d399';
    ctx.beginPath();
    const fw = Math.max(0, Math.min(1, state.gateFrac)) * tw;
    if (ctx.roundRect) ctx.roundRect(tx, ty, fw, th, 3); else ctx.rect(tx, ty, fw, th);
    ctx.fill();
  }

  // True while a timed run's opening background gate is being counted (source
  // not yet introduced - the holder is shown empty so it is clear the count is
  // genuine background, not the source).
  function isBackgroundPhase() { return !!(_series && _series.bg); }

  function drawSource(x, y, benchY, src) {
    const grabbed = (_dragging === 'src');
    const bgPhase = isBackgroundPhase();
    // Stand
    ctx.fillStyle = '#1f2d47';
    ctx.fillRect(x - 5, y, 10, benchY - y);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    // The source POSITION (srcX) is the WINDOW (aperture facing the detector),
    // since distance is measured from the window. The drum body sits BEHIND the
    // window, drawn shifted 11px left so the aperture (local +11) lands on srcX.
    // Visual only - currentDistance() and the physics are unchanged.
    const drumX = x - 11;
    ctx.fillRect(drumX - 22, benchY - 6, 44, 6);
    // Source holder (small drum) — neutral colour so emission is hidden
    ctx.save();
    ctx.translate(drumX, y);
    ctx.fillStyle = bgPhase ? '#2c3650' : '#46506a';   // dimmer when empty
    ctx.strokeStyle = grabbed ? 'rgba(52,211,153,0.9)' : 'rgba(255,255,255,0.35)';
    ctx.lineWidth = grabbed ? 3 : 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-15, -16, 26, 32, 6);
    else ctx.rect(-15, -16, 26, 32);
    ctx.fill(); ctx.stroke();
    if (bgPhase) {
      // Empty holder: show a hollow recess instead of the source aperture.
      ctx.fillStyle = '#19223a';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-9, -10, 16, 20, 4);
      else ctx.rect(-9, -10, 16, 20);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
    } else {
      // little aperture facing the detector
      ctx.fillStyle = '#2a3346';
      ctx.beginPath(); ctx.ellipse(11, 0, 3, 9, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    // Label + drag affordance (over the drum body, at drumX)
    if (bgPhase) {
      ctx.fillStyle = '#9fb4c9';
      ctx.font = '600 12px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('source removed', drumX, y - 28);
      ctx.fillStyle = '#7c8aa3';
      ctx.font = 'italic 10px -apple-system,sans-serif';
      ctx.fillText('measuring background', drumX, y - 16);
    } else {
      ctx.fillStyle = grabbed ? '#34d399' : '#cbd5e1';
      ctx.font = '600 13px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(src.short || 'Source', drumX, y - 28);
      drawGrabDots(drumX, y - 16);
    }
  }

  function drawAbsorber(x, y, benchY) {
    if (state.absorber === 'none') {
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.setLineDash([4, 5]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y - 50); ctx.lineTo(x, benchY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.font = 'italic 12px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('(no absorber)', x, y - 58);
      return;
    }
    let w, col, edge, label;
    if (state.absorber === 'idpaper') { w = 6; col = '#eef0e6'; edge = '#9fb8a0'; label = 'Paper (ideal)'; }
    else if (state.absorber === 'paper') { w = 6;  col = '#e8e3d4'; edge = '#bcb49a'; label = 'Paper'; }
    else if (state.absorber === 'al') { w = 14; col = '#aab4c2'; edge = '#7c8a9c'; label = 'Aluminium 3 mm'; }
    else if (state.absorber === 'al5') { w = 30; col = '#aab4c2'; edge = '#7c8a9c'; label = 'Aluminium 5 cm'; }
    else { w = 30; col = '#5c6675'; edge = '#3b424e'; label = 'Lead 5 cm'; }

    const grabbed = (_dragging === 'abs');
    const top = y - 54, bot = benchY;
    ctx.fillStyle = col;
    ctx.strokeStyle = grabbed ? 'rgba(52,211,153,0.9)' : edge;
    ctx.lineWidth = grabbed ? 3 : 2;
    ctx.beginPath(); ctx.rect(x - w / 2, top, w, bot - top); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x + w / 2 - 4, top, 4, bot - top);
    ctx.fillStyle = grabbed ? '#34d399' : '#cbd5e1';
    ctx.font = '600 12px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, x, top - 8);

    // Circular drag handle just below the bench line (probe-handle style):
    // a clear, non-overlapping grab target so the absorber is always grabbable.
    const hy = bot + 16;
    ctx.beginPath();
    ctx.arc(x, hy, 9, 0, 2 * Math.PI);
    ctx.fillStyle = grabbed ? '#34d399' : '#7c8a9c';
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
    // grip ticks
    ctx.strokeStyle = grabbed ? '#0b3b2c' : '#2a3346';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - 3, hy - 3); ctx.lineTo(x - 3, hy + 3);
    ctx.moveTo(x,     hy - 3); ctx.lineTo(x,     hy + 3);
    ctx.moveTo(x + 3, hy - 3); ctx.lineTo(x + 3, hy + 3);
    ctx.stroke();
    _absHandleY = hy;
  }

  /* Detector = G-M tube + a physical counter box wired to it, with a
     recessed window showing the running count. The whole assembly moves
     together as one draggable unit. */
  function drawDetector(x, y, benchY) {
    const grabbed = (_dragging === 'det');
    // Stand under the tube
    ctx.fillStyle = '#1f2d47';
    ctx.fillRect(x + 16, y + 6, 10, benchY - (y + 6));
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(x, benchY - 6, 44, 6);

    // G-M tube body (faces the source: window on its LEFT end)
    ctx.save();
    ctx.translate(x, y);
    const grd = ctx.createLinearGradient(0, -15, 0, 15);
    grd.addColorStop(0, '#9aa7bd'); grd.addColorStop(0.5, '#cbd5e1'); grd.addColorStop(1, '#7c8aa3');
    ctx.fillStyle = grd;
    ctx.strokeStyle = grabbed ? 'rgba(52,211,153,0.9)' : 'rgba(255,255,255,0.4)';
    ctx.lineWidth = grabbed ? 3 : 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(0, -14, 64, 28, 8);
    else ctx.rect(0, -14, 64, 28);
    ctx.fill(); ctx.stroke();
    // mica window facing source
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 14, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#2a3a52'; ctx.fill();
    ctx.strokeStyle = 'rgba(52,211,153,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();

    // Counter device box sitting to the RIGHT of the tube
    const boxX = x + 78, boxTop = y - 26, boxW = 96, boxH = 58;
    // cable from tube to box
    ctx.strokeStyle = '#2a3346'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 64, y + 6);
    ctx.bezierCurveTo(x + 72, y + 22, boxX - 6, boxTop + boxH + 8, boxX + 8, boxTop + boxH);
    ctx.stroke();
    // box body
    ctx.save();
    const bgrd = ctx.createLinearGradient(0, boxTop, 0, boxTop + boxH);
    bgrd.addColorStop(0, '#243349'); bgrd.addColorStop(1, '#16203a');
    ctx.fillStyle = bgrd;
    ctx.strokeStyle = grabbed ? 'rgba(52,211,153,0.9)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = grabbed ? 3 : 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(boxX, boxTop, boxW, boxH, 8);
    else ctx.rect(boxX, boxTop, boxW, boxH);
    ctx.fill(); ctx.stroke();
    // recessed count window
    const winX = boxX + 9, winY = boxTop + 12, winW = boxW - 18, winH = 26;
    ctx.fillStyle = '#06140f';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(winX, winY, winW, winH, 4);
    else ctx.rect(winX, winY, winW, winH);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();
    // the count, seven-segment-ish green
    ctx.fillStyle = '#34d399';
    ctx.font = '700 19px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(state.displayCount), winX + winW - 7, winY + winH / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    // "COUNTS" caption (or RATE-monitor hint when live)
    ctx.fillStyle = '#7c8aa3';
    ctx.font = '600 8px -apple-system,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(state.live ? 'COUNTS (live)' : 'COUNTS', winX + 1, boxTop + boxH - 5);
    ctx.restore();

    // LIVE power toggle + lamp, top-right corner of the counter box.
    const tgX = boxX + boxW - 16, tgY = boxTop + 10;
    ctx.beginPath();
    ctx.arc(tgX, tgY, 6, 0, 2 * Math.PI);
    ctx.fillStyle = state.live ? '#34d399' : '#3b4658';
    ctx.fill();
    ctx.strokeStyle = state.live ? '#0b3b2c' : '#5c6675';
    ctx.lineWidth = 1.5; ctx.stroke();
    // power glyph
    ctx.strokeStyle = state.live ? '#06140f' : '#9fb0c4';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(tgX, tgY + 0.5, 3, -Math.PI * 0.4, Math.PI * 1.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tgX, tgY - 3.5); ctx.lineTo(tgX, tgY); ctx.stroke();
    _liveToggle = { x: tgX, y: tgY, r: 12 };

    // Label above
    ctx.fillStyle = grabbed ? '#34d399' : '#cbd5e1';
    ctx.font = '600 13px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('G-M tube + counter', x + 40, y - 22);
    drawGrabDots(x + 32, y - 12);

    // LIVE lamp + 'not recorded' caption when in monitor mode.
    if (state.live) {
      ctx.fillStyle = '#34d399';
      ctx.font = '700 9px -apple-system,sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('\u25CF LIVE', boxX, boxTop - 8);
      ctx.fillStyle = '#9fb4c9';
      ctx.font = 'italic 9px -apple-system,sans-serif';
      ctx.fillText('monitor \u2014 not recorded', boxX + 42, boxTop - 8);
    }
  }

  // Small "grippable" dots to signal a handle is draggable.
  function drawGrabDots(cx, cy) {
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.arc(cx + i * 5, cy, 1.4, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawDistanceDim(srcX, detX, benchY) {
    const y = benchY + 24;
    ctx.strokeStyle = 'rgba(52,211,153,0.7)';
    ctx.fillStyle = 'rgba(52,211,153,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(srcX, y); ctx.lineTo(detX, y); ctx.stroke();
    arrowHead(srcX, y, -1); arrowHead(detX, y, 1);
    ctx.strokeStyle = 'rgba(52,211,153,0.3)';
    ctx.beginPath(); ctx.moveTo(srcX, benchY); ctx.lineTo(srcX, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(detX, benchY); ctx.lineTo(detX, y); ctx.stroke();
    ctx.fillStyle = '#9fd9c2';
    ctx.font = '600 14px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(currentDistance().toFixed(1) + ' cm', (srcX + detX) / 2, y + 17);
  }
  function arrowHead(x, y, dir) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + dir * 8, y - 4);
    ctx.lineTo(x + dir * 8, y + 4);
    ctx.closePath();
    ctx.fill();
  }

  /* ---- Idle redraw loop (cheap; no animation, just keeps the canvas in
     sync after drags/state changes without per-event redraw bookkeeping). */
  function idleLoop() {
    if (state.live && !state.running) {
      // Accumulate genuine Poisson counts at the live rate; counter climbs.
      const now = performance.now();
      const dt = Math.min(0.1, (now - state.liveLastT) / 1000);  // s, capped
      state.liveLastT = now;
      const rate = meanRate(currentSource(), state.absorber, currentDistance());
      if (dt > 0) state.liveCount += poisson(rate * dt);
      state.displayCount = state.liveCount;
      geiger.setRate(rate);                     // crackle density tracks live rate
    }
    if (!state.running) drawBench();
    requestAnimationFrame(idleLoop);
  }

  /* ============================================================= *
   * Event wiring                                                  *
   * ============================================================= */
  sourceSel.addEventListener('change', () => {
    state.sourceId = sourceSel.value;
    state.revealed = false;       // re-hide when source changes
    populateGates();              // gate options depend on the source
    renderReveal();
    drawBench();
  });
  absorberSel.addEventListener('change', () => {
    const wasNone = (state.absorber === 'none');
    state.absorber = absorberSel.value;
    // When an absorber is freshly placed (from None), centre it in the beam;
    // the student can then drag it anywhere between source and detector.
    if (wasNone && state.absorber !== 'none') {
      state.absCm = Math.round((state.srcCm + state.detCm) / 2);
    }
    drawBench();
  });

  /* ---- Dragging the source / detector along the bench --------------
     DC Circuit Builder touch pattern: canvasPoint scaling, generous hit
     radius, both mouse and touch with {passive:false}+preventDefault and
     a single-touch guard, touchcancel mirroring mouseup. No long-press or
     double-tap (pure drag). Locked while a run is in progress. */
  let _dragging = null;     // 'src' | 'det' | 'abs' | null
  let _grabDx = 0;          // offset (cm) between grab point and handle centre

  function hitHandle(px, py) {
    // Absorber grip handle (circle below the bench) - clear, separate target.
    if (_absHandle) {
      const ax = px - _absHandle.x, ay = py - _absHandle.y;
      if (ax * ax + ay * ay <= _absHandle.r * _absHandle.r) return 'abs';
    }
    // Detector (its box extends right and is larger).
    let dx = px - _detHandle.x, dy = py - _detHandle.y;
    if (dx * dx + dy * dy <= (_detHandle.r * _detHandle.r) ||
        (px >= _detHandle.x - 6 && px <= _detHandle.x + 180 &&
         py >= _detHandle.y - 30 && py <= _detHandle.y + 40)) {
      return 'det';
    }
    dx = px - _srcHandle.x; dy = py - _srcHandle.y;
    if (dx * dx + dy * dy <= (_srcHandle.r * _srcHandle.r) ||
        (px >= _srcHandle.x - 22 && px <= _srcHandle.x + 18 &&
         py >= _srcHandle.y - 20 && py <= _srcHandle.y + 40)) {
      return 'src';
    }
    return null;
  }

  function dragStart(px, py) {
    if (state.running) return false;
    // Live monitor toggle (power switch on the counter) - tap to flip.
    if (_liveToggle) {
      const lx = px - _liveToggle.x, ly = py - _liveToggle.y;
      if (lx * lx + ly * ly <= _liveToggle.r * _liveToggle.r) {
        toggleLive();
        return true;
      }
    }
    const hit = hitHandle(px, py);
    if (!hit) return false;
    _dragging = hit;
    const cm = (px - LEFT_DATUM_PX) / PX_PER_CM;
    _grabDx = cm - (hit === 'src' ? state.srcCm : hit === 'det' ? state.detCm : state.absCm);
    drawBench();
    return true;
  }

  /* Live monitor mode: free-running counter that climbs continuously at the
     live count rate, never logged. Toggling on resets the count to 0 and
     starts the Geiger crackle; toggling off freezes the number and stops
     the sound. The rate of climb (and crackle density) tracks the current
     geometry and absorber, so moving the tube or dropping in a material
     changes how fast the counter rises - just like a real ratemeter. */
  function toggleLive() {
    state.live = !state.live;
    if (state.live) {
      state.liveCount = 0;
      state.displayCount = 0;
      state.liveLastT = performance.now();
      if (geiger.isEnabled()) { geiger.start(); }
      // Can't take a formal measurement while monitoring - disable Run.
      runBtn.disabled = true;
      runBtn.classList.add('run-monitoring');
      runBtn.textContent = 'Monitoring\u2026';
    } else {
      geiger.stop();
      runBtn.disabled = false;
      runBtn.classList.remove('run-monitoring');
      runBtn.textContent = 'Run';
    }
    drawBench();
  }

  /* Soft magnetic snap to whole cm: the position follows the cursor
     continuously (smooth), but when within SNAP_WIN of a cm mark it is
     eased onto that mark, so it glides and clicks gently into each cm. */
  function softSnapCm(cm) {
    const SNAP_WIN = 0.3;             // cm: within this of a mark, magnet engages
    const nearest = Math.round(cm);
    const d = cm - nearest;
    if (Math.abs(d) <= SNAP_WIN) {
      // ease toward the mark: cubic pull, strongest near the mark
      const t = d / SNAP_WIN;         // -1..1
      return nearest + d * (t * t);   // pulls in, reaching the mark at d=0
    }
    return cm;
  }

  function dragMove(px, py) {
    if (!_dragging) return;
    let cm = (px - LEFT_DATUM_PX) / PX_PER_CM - _grabDx;
    cm = softSnapCm(cm);              // smooth follow + soft cm magnet
    if (_dragging === 'src') {
      const maxCm = state.detCm - CM_MIN;
      if (cm < 0) cm = 0;
      if (cm > maxCm) cm = maxCm;
      state.srcCm = cm;
      // Source is solid: push the absorber ahead of it if it would overlap.
      if (state.absorber !== 'none') {
        const minAbs = absMinCm();
        if (state.absCm < minAbs) state.absCm = minAbs;
      }
    } else if (_dragging === 'det') {
      const minCm = state.srcCm + CM_MIN;
      const maxCm = state.srcCm + CM_MAX;
      if (cm < minCm) cm = minCm;
      if (cm > maxCm) cm = maxCm;
      state.detCm = cm;
      // Detector is solid: push the absorber back if it would overlap.
      if (state.absorber !== 'none') {
        const maxAbs = absMaxCm();
        if (state.absCm > maxAbs) state.absCm = maxAbs;
      }
    } else {
      // Absorber as a solid object: its near edge may sit flush against the
      // source (so paper can intercept the alpha at the window); its far edge
      // stops just short of the tube with a small visible gap.
      const minCm = absMinCm();
      const maxCm = absMaxCm();
      if (minCm <= maxCm) {
        if (cm < minCm) cm = minCm;
        if (cm > maxCm) cm = maxCm;
      } else {
        cm = (state.srcCm + state.detCm) / 2;            // too tight: sit mid-beam
      }
      state.absCm = cm;
    }
    drawBench();
  }

  /* Half-width of the current absorber slab, in cm (for solid-object clamps). */
  function absHalfCm() {
    const a = state.absorber;
    const halfPx = (a === 'paper' || a === 'idpaper') ? 3
                 : (a === 'al')    ? 7
                 : 15;                                    // al5 / pb (30px wide)
    return halfPx / PX_PER_CM;
  }

  /* Minimum absorber centre (cm) so its near edge sits flush against the
     source holder window - no air gap, so paper can intercept the alpha right
     as it emerges. Half the slab width keeps the graphic from overlapping the
     holder. */
  function absMinCm() {
    const SRC_EDGE = 11 / PX_PER_CM;        // source holder front face
    return state.srcCm + SRC_EDGE + absHalfCm();
  }
  /* Maximum absorber centre (cm) so its far edge stops just short of the tube
     with a small visible gap. */
  function absMaxCm() {
    const GAP = 0.25;
    return state.detCm - absHalfCm() - GAP;
  }

  function dragEnd() {
    if (_dragging) {
      // Settle to 0.1 cm. The soft magnet has already eased the position onto
      // a whole cm if it was released near one; otherwise it honestly rests at
      // the in-between value (read to 1 dp).
      state.srcCm = Math.round(state.srcCm * 10) / 10;
      state.detCm = Math.round(state.detCm * 10) / 10;
      state.absCm = Math.round(state.absCm * 10) / 10;
      _dragging = null;
      drawBench();
    }
  }

  // Mouse
  bench.addEventListener('mousedown', (e) => {
    const p = canvasPoint(bench, e.clientX, e.clientY);
    if (dragStart(p.x, p.y)) e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!_dragging) return;
    const p = canvasPoint(bench, e.clientX, e.clientY);
    dragMove(p.x, p.y);
  });
  document.addEventListener('mouseup', dragEnd);

  // Touch (DC pattern)
  bench.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const p = canvasPoint(bench, t.clientX, t.clientY);
    if (dragStart(p.x, p.y)) e.preventDefault();
  }, { passive: false });
  bench.addEventListener('touchmove', (e) => {
    if (!_dragging) return;
    if (e.touches.length !== 1) return;
    e.preventDefault();
    const t = e.touches[0];
    const p = canvasPoint(bench, t.clientX, t.clientY);
    dragMove(p.x, p.y);
  }, { passive: false });
  bench.addEventListener('touchend', (e) => { e.preventDefault(); dragEnd(); }, { passive: false });
  bench.addEventListener('touchcancel', dragEnd, { passive: true });

  gateSel.addEventListener('change', () => {

    btn.classList.add('active');

    renderTable();
  });

  revealBtn.addEventListener('click', () => {
    state.revealed = !state.revealed;
    renderReveal();
  });

  const modeSeg = document.getElementById('absModeSeg');
  const readingsGroup = document.getElementById('absReadingsGroup');
  const readingsInput = document.getElementById('absReadingsInput');

  modeSeg.addEventListener('click', (e) => {

    const help = e.target.closest('.seg-help');

    runBtn.textContent = (state.mode === 'time') ? 'Start' : 'Run';
    populateSources();          // show/hide decaying sources for this mode
    populateGates();            // gate options may change with the source
    populateGraphPresets();     // graph presets depend on the mode
    updateGraphsAvailability();

    drawBench();
  });

  readingsInput.addEventListener('change', () => {
    let n = parseInt(readingsInput.value, 10);

  soundBtn.addEventListener('click', () => {
