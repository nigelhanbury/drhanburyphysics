    if (state.live) { if (on) geiger.start(); else geiger.stop(); }
  });

  clearBtn.addEventListener('click', () => {
    state.rows = [];
    rowCounter = 0;
    renderTable();
    setCounter(0, 0, state.gate, false);
    updateEpsEnabled();                       // offset slider unlocks once the table is empty
    updateGraphsAvailability();
    if (graphsWindow.classList.contains('open')) drawGraphsWindow();
  });

  /* ---- Init ---- */
  /* ============================================================= *
   * Graphs popout (Dice Decay style): Count rate vs time and      *
   * ln(count rate) vs time, with on-canvas lambda & half-life.    *
   * Only available once a timed decay series exists.              *
   * ============================================================= */
  const graphsBtn      = document.getElementById('absGraphsBtn');
  const graphsWindow   = document.getElementById('absGraphsWindow');
  const graphsHeader   = document.getElementById('absGraphsHeader');
  const graphsClose    = document.getElementById('absGraphsClose');
  const graphsGrip     = document.getElementById('absGraphsResizeGrip');
  const graphsCanvas   = document.getElementById('absGraphsCanvas');
  const graphsTypeSel  = document.getElementById('absGraphsTypeSelector');
  const graphsUncertChk = document.getElementById('absGraphsUncert');
  const gwCtx          = graphsCanvas.getContext('2d');
  let graphPreset      = 'cr';     // 'cr' | 'ln'
  let showUncert       = false;    // 'Show uncertainties' toggle, shared across presets

  graphsUncertChk.addEventListener('change', () => {
    showUncert = graphsUncertChk.checked;
    drawGraphsWindow();
  });

  /* The timed decay series available for plotting: the source rows of a time
     run (those with a time stamp), background-corrected. Returns an array of
     { t, rate, counts } with rate = background-corrected counts/s (>0 only, so
     ln is defined). */
  function seriesPoints() {
    const bgS = backgroundStats();            // { rate, sigma } or null
    const bgRate = bgS ? bgS.rate : 0;
    const bgVar = bgS ? bgS.sigma * bgS.sigma : 0;
    const pts = [];
    for (let i = 0; i < state.rows.length; i++) {
      const r = state.rows[i];
      if (r.isBackground) continue;           // skip the background row
      if (typeof r.tMid !== 'number') continue; // only timed-series rows
      const corr = r.rate - bgRate;           // background-corrected count rate
      // Poisson counting uncertainty: sigma(N)=sqrt(N), so sigma(rate)=sqrt(N)/t;
      // background sigma added in quadrature (verified vs Monte Carlo).
      const sigma = Math.sqrt(r.counts / (r.gate * r.gate) + bgVar);
      if (corr > 0) pts.push({ t: r.tMid, rate: corr, counts: r.counts, sigma: sigma });
    }
    return pts;
  }

  function hasTimeData() { return seriesPoints().length >= 2; }

  /* Single-reading rows that have a source present (background excluded),
     background-corrected, for the count-rate-vs-distance plot. Each point is
     { d, rate, counts, gate, absorber, sourceName }. We do NOT filter by absorber or
     source - if the experimenter changed something other than distance, the
     points reflect that (a fair-testing lesson); a notice flags it and they
     inspect the table. */
  function distancePoints() {
    const bgS = backgroundStats();
    const bgRate = bgS ? bgS.rate : 0;
    const bgVar = bgS ? bgS.sigma * bgS.sigma : 0;
    const pts = [];
    for (let i = 0; i < state.rows.length; i++) {
      const r = state.rows[i];
      if (r.isBackground) continue;             // not a distance reading
      if (typeof r.tMid === 'number') continue; // exclude timed-series rows
      const corr = r.rate - bgRate;
      const sigma = Math.sqrt(r.counts / (r.gate * r.gate) + bgVar);
      if (corr > 0) pts.push({ d: r.distance, rate: corr, counts: r.counts, gate: r.gate, absorber: r.absorber, sourceName: r.sourceName, sigma: sigma });
    }
    return pts;
  }

  /* True if the distance dataset has >= 3 points spanning >= 2 distinct
     distances (a real, plottable distance experiment). */
  function hasDistanceData() {
    const pts = distancePoints();
    if (pts.length < 3) return false;
    const TOL = 0.05;
    for (let i = 1; i < pts.length; i++) {
      if (Math.abs(pts[i].d - pts[0].d) > TOL) return true;
    }
    return false;
  }

  /* Which non-distance variables changed across the distance dataset (for the
     fair-testing notice). Returns a short list e.g. ['absorber','source']. */
  function distanceVariedFlags() {
    const pts = distancePoints();
    const flags = [];
    if (pts.length) {
      let absVaried = false, srcVaried = false;
      for (let i = 1; i < pts.length; i++) {
        if (pts[i].absorber !== pts[0].absorber) absVaried = true;
        if (pts[i].sourceName !== pts[0].sourceName) srcVaried = true;
      }
      if (absVaried) flags.push('absorber');
      if (srcVaried) flags.push('source');
    }
    return flags;
  }

  /* Data for the absorber bar chart: one bar per single-reading row (raw,
     UNCORRECTED count rate), background included as its own bar. Repeats are
     kept as separate bars so the scatter shows. Returns { ok, reason, bars,
     bgRate } where ok is false (with a reason) unless the readings form a valid
     absorber comparison: same source, same distance, same gate, with the only
     deliberately-varied quantity being the absorber. If anything else varies
     the chart is not drawn (an unfair comparison would mislead). */
  function absorberBarData() {
    // gather single-reading rows (exclude timed-series rows)
    const src = [];          // source-present readings
    let bgRate = null, bgSigma = null;
    for (let i = 0; i < state.rows.length; i++) {
      const r = state.rows[i];
      if (typeof r.tMid === 'number') continue;     // skip decay-series rows
      if (r.isBackground) { bgRate = r.rate; bgSigma = Math.sqrt(r.counts) / r.gate; continue; }
      src.push(r);
    }
    if (src.length < 2) return { ok: false, reason: 'few', bars: [], bgRate: bgRate };

    // validity: source and distance must be constant across the readings (the
    // fair-test core). The ABSORBER may change (that is the experiment) and the
    // GATE may change too: count RATE already normalises for gate time, so the
    // rates stay comparable - the differing PRECISION is expressed honestly by
    // the counting-uncertainty whiskers (sqrt(N)/gate per bar).
    const TOLD = 0.05;
    let distVaried = false, srcVaried = false, gateVaried = false;
    for (let i = 1; i < src.length; i++) {
      if (Math.abs(src[i].distance - src[0].distance) > TOLD) distVaried = true;
      if (src[i].sourceName !== src[0].sourceName) srcVaried = true;
      if (src[i].gate !== src[0].gate) gateVaried = true;
    }
    if (distVaried || srcVaried) {
      return { ok: false, reason: 'varied', bars: [], bgRate: bgRate };
    }

    // build bars in table order; background (if any) first as the baseline.
    // Bars show RAW (uncorrected) rates, so each bar's counting uncertainty
    // is simply sqrt(N)/gate for its own reading - no background quadrature.
    // When gates differ between readings, each label carries its gate so the
    // bars stay self-explanatory.
    const bars = [];
    if (bgRate !== null) bars.push({ label: 'Background', rate: bgRate, isBg: true, sigma: bgSigma });
    for (let i = 0; i < src.length; i++) {
      let lab = ABSORBER_LABEL[src[i].absorber] || src[i].absorber;
      if (gateVaried) lab += ' \u00b7 ' + src[i].gate + ' s';
      bars.push({ label: lab, rate: src[i].rate, isBg: false, sigma: Math.sqrt(src[i].counts) / src[i].gate });
    }
    return { ok: true, reason: '', bars: bars, bgRate: bgRate };
  }

  /* The bars preset is offered as soon as there are two or more single
     readings with a source present, even if they are not yet a fair set:
     selecting it then shows WHY on the canvas, rather than hiding the
     explanation behind a greyed-out button. */
  function hasAbsorberData() {
    let k = 0;
    for (let i = 0; i < state.rows.length; i++) {
      const r = state.rows[i];
      if (typeof r.tMid === 'number' || r.isBackground) continue;
      k++;
    }
    return k >= 2;
  }

  /* ---- Count distribution: repeats of one identical setup ---------------
     Gathers the LARGEST group of readings taken at one setup (same source,
     distance, absorber and gate). Single readings qualify; timed-series rows
     qualify too when the source is NON-decaying, since a steady source makes
     every gate of a time run an identical repeat - the quickest way to
     collect 20 or more. Decaying-source series rows are excluded (their mean
     drifts). Background runs form their own group. ---- */
  function sourceByName(name) {
    for (let i = 0; i < SOURCES.length; i++) if (SOURCES[i].name === name) return SOURCES[i];
    return null;
  }

  function histGroupData() {
    const groups = {};
    let candidates = 0;
    for (let i = 0; i < state.rows.length; i++) {
      const r = state.rows[i];
      if (typeof r.tMid === 'number' && !r.isBackground) {
        const s = sourceByName(r.sourceName);
        if (!s || s.decaying) continue;        // drifting mean: not repeats
      }
      candidates++;
      const key = r.sourceName + '|' + r.distance.toFixed(1) + '|' + r.absorber + '|' + r.gate;
      if (!groups[key]) groups[key] = { counts: [], last: 0, sourceName: r.sourceName, distance: r.distance, absorber: r.absorber, gate: r.gate, isBackground: r.isBackground };
      groups[key].counts.push(r.counts);
      groups[key].last = i;
    }
    let best = null;
    for (const k in groups) {
      const g = groups[k];
      if (!best || g.counts.length > best.counts.length ||
          (g.counts.length === best.counts.length && g.last > best.last)) best = g;
    }
    if (!best || best.counts.length < 5) {
      return { ok: false, reason: 'few', n: best ? best.counts.length : 0, candidates: candidates };
    }
    return { ok: true, reason: '', group: best, candidates: candidates };
  }

  /* Clickable once two or more qualifying readings exist, so the empty-state
     message can explain what to collect (reachable-refusal pattern). */
  function hasHistData() { return histGroupData().candidates >= 2; }

  /* The full set of graph presets, always shown so the options are visible up
     front. Each tab greys out individually until its data exists (see
     presetAvailable). Order: time graphs, distance graphs, then the bar chart. */
  function presetsForMode() {
    return [
      { id: 'cr', label: 'Count rate vs time' },
      { id: 'ln', label: 'ln(count rate) vs time' },
      { id: 'crdist', label: 'Count rate vs distance' },
      { id: 'crinvd2', label: 'Count rate vs 1/d\u00b2' },
      { id: 'invsqrtc', label: '1/\u221a(count rate) vs distance' },
      { id: 'absorber', label: 'Count rate (bars)' },
      { id: 'histo', label: 'Count distribution' }
    ];
  }

  /* Whether a given preset currently has data to plot (so its tab can be
     enabled/disabled individually). */
  function presetAvailable(id) {
    if (id === 'cr' || id === 'ln') return hasTimeData();
    if (id === 'crdist' || id === 'crinvd2' || id === 'invsqrtc') return hasDistanceData();
    if (id === 'absorber') return hasAbsorberData();
    if (id === 'histo') return hasHistData();
    return true;
  }

  function populateGraphPresets() {
    const presets = presetsForMode();
    // prefer to land on an AVAILABLE preset: keep the current one if it is still
    // offered AND has data; else pick the first available; else the first.
    let curOk = false;
    for (let i = 0; i < presets.length; i++) if (presets[i].id === graphPreset) curOk = true;
    if (!curOk || !presetAvailable(graphPreset)) {
      let picked = null;
      for (let i = 0; i < presets.length; i++) if (presetAvailable(presets[i].id)) { picked = presets[i].id; break; }
      graphPreset = picked || presets[0].id;
    }
    let html = '';
    for (let i = 0; i < presets.length; i++) {
      const avail = presetAvailable(presets[i].id);
      html += '<button class="graphs-type-btn' + (presets[i].id === graphPreset ? ' active' : '') +
              (avail ? '' : ' disabled') + '"' + (avail ? '' : ' disabled') +
              ' data-gtype="' + presets[i].id + '">' + presets[i].label + '</button>';
    }
    graphsTypeSel.innerHTML = html;
  }

  function updateGraphsAvailability() {
    // The Graphs button is always enabled: pressing it opens the window so the
    // full set of graph options is visible (greyed until their data exists).
    graphsBtn.disabled = false;
  }

  /* Exponential best fit on the series, matching the Dice Decay / Excel method:
     least squares on ln(rate) vs time WEIGHTED BY counts^2, so high-count
     points dominate and the noisy low-count tail barely pulls the line.
     Returns { k (=lambda, per second), A (rate at t=0) } or null. */
  function computeSeriesFit() {
    const pts = seriesPoints();
    let sw = 0, swx = 0, swy = 0, swxx = 0, swxy = 0, count = 0;
    for (let i = 0; i < pts.length; i++) {
      const x = pts[i].t, y = Math.log(pts[i].rate), w = pts[i].counts * pts[i].counts;
      sw += w; swx += w * x; swy += w * y; swxx += w * x * x; swxy += w * x * y;
      count++;
    }
    if (count < 2) return null;
    const denom = sw * swxx - swx * swx;
    if (Math.abs(denom) < 1e-9) return null;
    const slope = (sw * swxy - swx * swy) / denom;   // = -k
    const intercept = (swy - slope * swx) / sw;      // = ln(A)
    return { k: -slope, A: Math.exp(intercept) };
  }

  /* Cubic SMOOTHING spline (C. H. Reinsch, Numer. Math. 1967), weighted by
     the Poisson standard error of each reading. Finds the natural cubic
     spline f that minimises the bending energy  integral of f''(x)^2  subject
     to the weighted chi-squared  sum(((y_i - f(x_i)) / sigma_i)^2) <= n  (the
     classic "discrepancy principle": the smoothest curve that is statistically
     consistent with the data). Unlike an INTERPOLATING spline it is not forced
     through the Poisson scatter, so it cannot wobble - any wobble would mean
     more curvature than necessary, contradicting the minimisation. It passes
     within about one standard error of every point, exactly like a hand-drawn
     curve of best fit. It makes NO physical claim (not an inverse-square fit),
     so it is honest for gamma, beta or alpha data alike.

     xs must be strictly increasing; sigs are 1-standard-error values (>0).
     Returns an evaluator f(x). Implementation: solve the Reinsch system
     (R + lambda * Q^T W^-1 Q) gamma = Q^T y  for the knot second derivatives
     gamma (banded LDL^T, pentadiagonal), with lambda found by geometric
     bisection so the resulting chi-squared equals n. */
  function smoothingSpline(xs, ys, sigs) {
    const n = xs.length;
    if (n < 3) {                                   // 1-2 points: straight line
      const x0 = xs[0], y0 = ys[0];
      const sl = (n === 2) ? (ys[1] - ys[0]) / (xs[1] - xs[0]) : 0;
      return function (t) { return y0 + sl * (t - x0); };
    }
    const m = n - 2;
    const h = new Array(n - 1);
    for (let i = 0; i < n - 1; i++) h[i] = xs[i + 1] - xs[i];
    const v = new Array(n);                        // sigma^2 (= W^-1 diagonal)
    for (let i = 0; i < n; i++) v[i] = sigs[i] * sigs[i];

    // Bands of R (tridiagonal) and B = Q^T diag(v) Q (pentadiagonal), m x m,
    // plus the right-hand side Q^T y (second divided differences of y).
    const R0 = new Array(m), R1 = new Array(m).fill(0);
    const B0 = new Array(m), B1 = new Array(m).fill(0), B2 = new Array(m).fill(0);
    const rhs = new Array(m);
    for (let jj = 0; jj < m; jj++) {
      const j = jj + 1;                            // interior knot index
      const a = 1 / h[j - 1], b = 1 / h[j];
      R0[jj] = (h[j - 1] + h[j]) / 3;
      if (jj < m - 1) R1[jj] = h[j] / 6;
      B0[jj] = v[j - 1] * a * a + v[j] * (a + b) * (a + b) + v[j + 1] * b * b;
      if (jj < m - 1) {
        const c = 1 / h[j + 1];
        B1[jj] = -b * (v[j] * (a + b) + v[j + 1] * (b + c));
      }
      if (jj < m - 2) B2[jj] = v[j + 1] * b / h[j + 1];
      rhs[jj] = (ys[j + 1] - ys[j]) * b - (ys[j] - ys[j - 1]) * a;
    }

    // Solve (R + lambda*B) g = rhs by banded LDL^T; return knot values f,
    // full gamma (natural ends = 0) and the weighted chi-squared.
    function solveChi(lambda) {
      const A0 = new Array(m), A1 = new Array(m), A2 = new Array(m);
      for (let i = 0; i < m; i++) {
        A0[i] = R0[i] + lambda * B0[i];
        A1[i] = R1[i] + lambda * B1[i];
        A2[i] = lambda * B2[i];
      }
      const d = new Array(m), l1 = new Array(m).fill(0), l2 = new Array(m).fill(0), z = new Array(m);
      for (let i = 0; i < m; i++) {
        if (i >= 2) l2[i] = A2[i - 2] / d[i - 2];
        if (i >= 1) l1[i] = (A1[i - 1] - (i >= 2 ? l2[i] * l1[i - 1] * d[i - 2] : 0)) / d[i - 1];
        d[i] = A0[i] - (i >= 1 ? l1[i] * l1[i] * d[i - 1] : 0) - (i >= 2 ? l2[i] * l2[i] * d[i - 2] : 0);
        if (!(d[i] > 1e-300)) d[i] = 1e-300;       // PD in exact arithmetic; guard rounding
        z[i] = rhs[i] - (i >= 1 ? l1[i] * z[i - 1] : 0) - (i >= 2 ? l2[i] * z[i - 2] : 0);
      }
      const g = new Array(m);
      for (let i = m - 1; i >= 0; i--) {
        g[i] = z[i] / d[i] - (i + 1 < m ? l1[i + 1] * g[i + 1] : 0) - (i + 2 < m ? l2[i + 2] * g[i + 2] : 0);
      }
      const gam = new Array(n).fill(0);            // natural spline: gamma = 0 at ends
      for (let i = 0; i < m; i++) gam[i + 1] = g[i];
      const f = new Array(n);
      let chi2 = 0;
      for (let i = 0; i < n; i++) {                // residual y - f = lambda * v * (Q gamma)
        const t1 = (i < n - 1) ? (gam[i + 1] - gam[i]) / h[i] : 0;
        const t2 = (i > 0) ? (gam[i] - gam[i - 1]) / h[i - 1] : 0;
        const res = lambda * v[i] * (t1 - t2);
        f[i] = ys[i] - res;
        const s = (sigs[i] > 0) ? res / sigs[i] : 0;
        chi2 += s * s;
      }
      return { f: f, gam: gam, chi2: chi2 };
    }

    // Discrepancy principle: chi2(lambda) is monotone increasing, so bisect
    // (geometrically) for chi2 = n. If even the smoothest end of the range
    // already satisfies chi2 <= n, take it (data consistent with ~a line).
    let s2 = 0; for (let i = 0; i < n; i++) s2 += v[i];
    s2 = Math.max(s2 / n, 1e-12);
    const hbar = (xs[n - 1] - xs[0]) / (n - 1);
    const lref = (hbar * hbar * hbar) / s2;        // dimensional scale of lambda
    let lo = lref * 1e-8, hi = lref * 1e8;
    let sol = solveChi(hi);
    if (sol.chi2 > n) {
      for (let it = 0; it < 60; it++) {
        const mid = Math.sqrt(lo * hi);
        if (solveChi(mid).chi2 > n) hi = mid; else lo = mid;
      }
      sol = solveChi(Math.sqrt(lo * hi));
    }

    // Natural cubic spline evaluator from knot values f and 2nd derivatives.
    const fk = sol.f, gam = sol.gam;
    return function (t) {
      let i = n - 2;
      if (t <= xs[0]) i = 0;
      else { for (let k = 0; k < n - 1; k++) { if (t <= xs[k + 1]) { i = k; break; } } }
      const hh = h[i], A = (xs[i + 1] - t) / hh, B = (t - xs[i]) / hh;
      return A * fk[i] + B * fk[i + 1] +
             ((A * A * A - A) * gam[i] + (B * B * B - B) * gam[i + 1]) * hh * hh / 6;
    };
  }

  /* Format a y-axis tick value with enough decimals to avoid duplicate labels
     when the scale is small (e.g. an empty graph with max 1, or a low count
     rate). */
  function fmtTick(v, top) {
    const dp = (top < 2) ? 2 : (top < 10) ? 1 : 0;
    return v.toFixed(dp);
  }

  function hasAnyReadings() { return state.rows && state.rows.length > 0; }

  /* Shared 'no readings yet' message. Returns true if drawn (no readings), so
     drawGraphsWindow returns early before any preset-specific message. */
  function drawEmptyPrompt() {
    if (hasAnyReadings()) return false;
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    gwCtx.fillStyle = '#9fb4c9'; gwCtx.font = '600 16px -apple-system,sans-serif';
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle';
    gwCtx.fillText('No readings yet', W / 2, H / 2 - 12);
    gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '14px -apple-system,sans-serif';
    gwCtx.fillText('Record some readings - each graph above lights up when its data is available.', W / 2, H / 2 + 12);
    return true;
  }

  function niceStepG(maxVal, maxTicks) {
    const raw = maxVal / maxTicks;
    if (raw <= 0) return 1;
    const pow = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    const norm = raw / pow;
    let step;
    if (norm <= 1) step = 1; else if (norm <= 2) step = 2; else if (norm <= 5) step = 5; else step = 10;
    return step * pow;
  }

  /* ---- Counting-uncertainty error bars (shared by all presets) --------
     Vertical I-beam at pixel x, spanning yTopPix..yBotPix, clamped to the
     plot area [pyTop, pyBot]. A cap is drawn only on an UNCLAMPED end, so a
     bar running off the plot visibly does so instead of gaining a false cap. */
  function gwErrorBar(cx, yTopPix, yBotPix, pyTop, pyBot, color) {
    const capW = 5;
    let t = yTopPix, b = yBotPix;
    const clampT = (t < pyTop), clampB = (b > pyBot);
    if (clampT) t = pyTop;
    if (clampB) b = pyBot;
    if (b <= t) return;
    gwCtx.strokeStyle = color; gwCtx.lineWidth = 1.6;
    gwCtx.beginPath();
    gwCtx.moveTo(cx, t); gwCtx.lineTo(cx, b);
    if (!clampT) { gwCtx.moveTo(cx - capW, t); gwCtx.lineTo(cx + capW, t); }
    if (!clampB) { gwCtx.moveTo(cx - capW, b); gwCtx.lineTo(cx + capW, b); }
    gwCtx.stroke();
  }

  /* One-line caption, top-right of the plot, shown when error bars are on. */
  function gwUncertCaption(px, py, pw) {
    gwCtx.fillStyle = '#9aa7bd';
    gwCtx.font = '12px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'bottom';
    gwCtx.fillText('Error bars: counting uncertainty (from \u00b1\u221aN in the counts)', px + pw, py - 8);
  }

  /* Notices above the distance graphs: the fair-testing warning (anything
     other than distance varied) and a no-background warning. Without a
     background the rates are plotted uncorrected; the 1/d\u00b2 line then gains
     a y-intercept equal to the background, and the 1/\u221aC line curves at
     large d, so the epsilon read from its intercept is biased. */
  function gwDistanceNotices(px, pw) {
    gwCtx.font = 'bold 14px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top';
    let y = 8;
    const flags = distanceVariedFlags();
    if (flags.length) {
      const what = flags.join(' and ');
      gwCtx.fillStyle = '#fbbf24';
      gwCtx.fillText('\u26a0 ' + what.charAt(0).toUpperCase() + what.slice(1) + ' changed \u2014 check the table', px + pw / 2, y);
      y += 17;
    }
    if (backgroundStats() === null) {
      gwCtx.fillStyle = '#fbbf24';
      gwCtx.fillText('\u26a0 No background measured \u2014 rates are uncorrected', px + pw / 2, y);
    }
  }

  function drawGraphsWindow() {
    const rect = graphsCanvas.getBoundingClientRect();
    const w = Math.max(300, Math.round(rect.width)), h = Math.max(200, Math.round(rect.height));
    if (graphsCanvas.width !== w)  graphsCanvas.width = w;
    if (graphsCanvas.height !== h) graphsCanvas.height = h;
    if (drawEmptyPrompt()) return;
    if (graphPreset === 'ln') gwDrawLn();
    else if (graphPreset === 'crdist') gwDrawCRvsDist();
    else if (graphPreset === 'crinvd2') gwDrawCRvsInvD2();
    else if (graphPreset === 'invsqrtc') gwDrawInvSqrtC();
    else if (graphPreset === 'absorber') gwDrawAbsorberBars();
    else if (graphPreset === 'histo') gwDrawHist();
    else gwDrawCR();
  }

  /* ---- Count rate vs time: corrected rate (crosses) + exponential fit ---- */
  function gwDrawCR() {
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    const pts = seriesPoints();
    const mL = 86, mR = 36, mT = 30, mB = 60;
    const px = mL, py = mT, pw = W - mL - mR, ph = H - mT - mB;

    let tMax = 5, rMax = 1;
    for (let i = 0; i < pts.length; i++) { if (pts[i].t > tMax) tMax = pts[i].t; if (pts[i].rate > rMax) rMax = pts[i].rate; }
    const fit = computeSeriesFit();
    if (fit && fit.A > rMax) rMax = fit.A;
    const yTop = rMax * 1.08;
    tMax = tMax * 1.05;

    function X(t) { return px + (t / tMax) * pw; }
    function Y(v) { return py + ph - (v / yTop) * ph; }

    gwCtx.strokeStyle = 'rgba(255,255,255,0.06)'; gwCtx.lineWidth = 1;
    for (let g = 1; g <= 5; g++) { const gy = py + (g / 5) * ph; gwCtx.beginPath(); gwCtx.moveTo(px, gy); gwCtx.lineTo(px + pw, gy); gwCtx.stroke(); }
    gwCtx.strokeStyle = 'rgba(255,255,255,0.35)'; gwCtx.lineWidth = 2;
    gwCtx.beginPath(); gwCtx.moveTo(px, py - 6); gwCtx.lineTo(px, py + ph); gwCtx.lineTo(px + pw + 6, py + ph); gwCtx.stroke();

    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1'; gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle';
    for (let g = 0; g <= 5; g++) { const v = yTop * g / 5; const ty = py + ph - (g / 5) * ph; gwCtx.fillText(fmtTick(v, yTop), px - 9, ty); }
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top';
    const xStep = niceStepG(tMax, 8);
    for (let tv = 0; tv <= tMax + 1e-9; tv += xStep) { gwCtx.fillText(tv.toFixed(0), X(tv), py + ph + 9); }
    gwCtx.fillStyle = 'rgba(255,255,255,0.92)'; gwCtx.font = 'italic 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillText('time / s', px + pw / 2, py + ph + 32);
    gwCtx.save(); gwCtx.translate(px - 60, py + ph / 2); gwCtx.rotate(-Math.PI / 2);
    gwCtx.textBaseline = 'middle'; gwCtx.fillText('count rate / s\u207B\u00B9', 0, 0); gwCtx.restore();

    if (fit) {
      gwCtx.strokeStyle = '#fbbf24'; gwCtx.lineWidth = 2.4; gwCtx.beginPath();
      let started = false;
      for (let s = 0; s <= 240; s++) {
        const th = tMax * s / 240, yv = fit.A * Math.exp(-fit.k * th);
        const gx = X(th), gy = Y(yv);
        if (!started) { gwCtx.moveTo(gx, gy); started = true; } else gwCtx.lineTo(gx, gy);
      }
      gwCtx.stroke();
    }
    if (showUncert && pts.length) {
      for (let i = 0; i < pts.length; i++) {
        const ex = X(pts[i].t);
        gwErrorBar(ex, Y(pts[i].rate + pts[i].sigma), Y(pts[i].rate - pts[i].sigma), py, py + ph, 'rgba(52,211,153,0.7)');
      }
      gwUncertCaption(px, py, pw);
    }
    gwCtx.strokeStyle = '#34d399'; gwCtx.lineWidth = 2.2; const r = 5;
    for (let i = 0; i < pts.length; i++) {
      const cx = X(pts[i].t), cy = Y(pts[i].rate);
      gwCtx.beginPath();
      gwCtx.moveTo(cx - r, cy - r); gwCtx.lineTo(cx + r, cy + r);
      gwCtx.moveTo(cx + r, cy - r); gwCtx.lineTo(cx - r, cy + r);
      gwCtx.stroke();
    }
    if (!pts.length) {
      gwCtx.fillStyle = '#9fb4c9'; gwCtx.font = '600 16px -apple-system,sans-serif';
      gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle';
      gwCtx.fillText('No time data available', px + pw / 2, py + ph / 2 - 12);
      gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '14px -apple-system,sans-serif';
      gwCtx.fillText('Switch to "Count rate vs time" mode and run a decay series.', px + pw / 2, py + ph / 2 + 12);
    }
  }

  /* ---- Count rate vs distance: background-corrected rate (crosses) vs the
     source-tube distance, in the same style as the time graphs, with a smooth
     curve of best fit (weighted smoothing spline - see smoothingSpline above;
     it makes no physical claim). If anything other than
     distance varied across the readings, a notice names the variable so the
     student can inspect the table (a fair-testing lesson). ---- */
  function gwDrawCRvsDist() {
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    const pts = distancePoints();
    const mL = 86, mR = 36, mT = 42, mB = 60;
    const px = mL, py = mT, pw = W - mL - mR, ph = H - mT - mB;

    // safety net: need more than two points to show the fall-off meaningfully
    if (pts.length < 3) {
      gwCtx.fillStyle = '#9fb4c9'; gwCtx.font = '600 16px -apple-system,sans-serif';
      gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle';
      gwCtx.fillText('More than 2 data points needed', W / 2, H / 2 - 12);
      gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '14px -apple-system,sans-serif';
      gwCtx.fillText('Take readings at three or more different distances.', W / 2, H / 2 + 12);
      return;
    }

    let dMax = 1, rMax = 1;
    for (let i = 0; i < pts.length; i++) { if (pts[i].d > dMax) dMax = pts[i].d; if (pts[i].rate > rMax) rMax = pts[i].rate; }
    const yTop = rMax * 1.08; dMax = dMax * 1.05;

    function X(d) { return px + (d / dMax) * pw; }
    function Y(v) { return py + ph - (v / yTop) * ph; }

    gwCtx.strokeStyle = 'rgba(255,255,255,0.06)'; gwCtx.lineWidth = 1;
    for (let g = 1; g <= 5; g++) { const gy = py + (g / 5) * ph; gwCtx.beginPath(); gwCtx.moveTo(px, gy); gwCtx.lineTo(px + pw, gy); gwCtx.stroke(); }
    gwCtx.strokeStyle = 'rgba(255,255,255,0.35)'; gwCtx.lineWidth = 2;
    gwCtx.beginPath(); gwCtx.moveTo(px, py - 6); gwCtx.lineTo(px, py + ph); gwCtx.lineTo(px + pw + 6, py + ph); gwCtx.stroke();

    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1'; gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle';
    for (let g = 0; g <= 5; g++) { const v = yTop * g / 5; const ty = py + ph - (g / 5) * ph; gwCtx.fillText(fmtTick(v, yTop), px - 9, ty); }
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top';
    const xStep = niceStepG(dMax, 8);
    for (let dv = 0; dv <= dMax + 1e-9; dv += xStep) { gwCtx.fillText(dv.toFixed(0), X(dv), py + ph + 9); }
    gwCtx.fillStyle = 'rgba(255,255,255,0.92)'; gwCtx.font = 'italic 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillText('distance / cm', px + pw / 2, py + ph + 32);
    gwCtx.save(); gwCtx.translate(px - 60, py + ph / 2); gwCtx.rotate(-Math.PI / 2);
    gwCtx.textBaseline = 'middle'; gwCtx.fillText('count rate / s\u207B\u00B9', 0, 0); gwCtx.restore();

    // notices: fair-testing + missing background
    gwDistanceNotices(px, pw);

    // smooth curve of best fit (Reinsch cubic SMOOTHING spline): the
    // smoothest curve that is statistically consistent with the Poisson
    // counting uncertainty of each reading (sigma = sqrt(counts)/gate, the
    // standard error of a count rate), via the discrepancy principle
    // chi-squared = number of points. It hugs the data to within about one
    // standard error but is NOT forced through the scatter, so it cannot
    // wobble - unlike an interpolating spline, which must flex its curvature
    // back and forth to thread Poisson-scattered points. The smoothing is
    // done in LOG-LOG space, where any power-law fall-off is nearly straight:
    // this removes the violent curvature at small d (which a natural spline's
    // zero-curvature end condition cannot follow in linear space) and makes
    // the curve positive by construction. Like a hand-drawn best-fit curve it
    // makes NO physical claim (no inverse-square exponent is assumed - the
    // spline traces whatever shape the data makes), so it is honest for
    // gamma, beta or alpha data alike. Points are sorted by distance and any
    // readings at the same distance are averaged first (uncertainties
    // combined as standard error of the mean).
    const byD = {};
    for (let i = 0; i < pts.length; i++) {
      const key = pts[i].d.toFixed(2);
      if (!byD[key]) byD[key] = { d: pts[i].d, sum: 0, varSum: 0, n: 0 };
      const sig = (pts[i].counts > 0 && pts[i].gate > 0)
        ? Math.sqrt(pts[i].counts) / pts[i].gate          // Poisson SE of the rate
        : Math.max(0.05 * pts[i].rate, 0.5);              // fallback for odd rows
      byD[key].sum += pts[i].rate; byD[key].varSum += sig * sig; byD[key].n++;
    }
    const uniq = [];
    for (const key in byD) uniq.push({
      d: byD[key].d,
      rate: byD[key].sum / byD[key].n,
      sig: Math.sqrt(byD[key].varSum) / byD[key].n
    });
    uniq.sort(function (a, b) { return a.d - b.d; });
    if (uniq.length >= 2) {
      // transform to log-log: x = ln d, y = ln rate, sigma_lny = sigma/rate
      const xs = [], ys = [], ss = [];
      for (let i = 0; i < uniq.length; i++) {
        xs.push(Math.log(Math.max(uniq[i].d, 0.05)));
        ys.push(Math.log(uniq[i].rate));
        ss.push(Math.max(uniq[i].sig / uniq[i].rate, 1e-6));
      }
      const g = smoothingSpline(xs, ys, ss);
      const d0 = uniq[0].d, d1 = uniq[uniq.length - 1].d;
      gwCtx.save();
      gwCtx.beginPath(); gwCtx.rect(px, py, pw, ph); gwCtx.clip();  // never leave the panel
      gwCtx.strokeStyle = '#fbbf24'; gwCtx.lineWidth = 2.4; gwCtx.beginPath();
      // running minimum: count rate always FALLS with distance (true for any
      // source), so the trend curve is kept non-increasing - this clips the
      // slight upstream "ringing" a spline can show just before a very sharp
      // drop (e.g. the alpha range cut-off) into a natural flat shelf.
      let runMin = Infinity;
      for (let s = 0; s <= 240; s++) {
        const t = d0 + (d1 - d0) * s / 240;
        let yv = Math.exp(g(Math.log(Math.max(t, 0.05))));        // back-transform
        if (yv < runMin) runMin = yv; else yv = runMin;
        if (s === 0) gwCtx.moveTo(X(t), Y(yv)); else gwCtx.lineTo(X(t), Y(yv));
      }
      gwCtx.stroke();
      gwCtx.restore();
    }

    // counting-uncertainty error bars (under the crosses)
    if (showUncert) {
      for (let i = 0; i < pts.length; i++) {
        const ex = X(pts[i].d);
        gwErrorBar(ex, Y(pts[i].rate + pts[i].sigma), Y(pts[i].rate - pts[i].sigma), py, py + ph, 'rgba(52,211,153,0.7)');
      }
      gwUncertCaption(px, py, pw);
    }

    // data crosses (identical style to the time graphs)
    gwCtx.strokeStyle = '#34d399'; gwCtx.lineWidth = 2.2; const r = 5;
    for (let i = 0; i < pts.length; i++) {
      const cx = X(pts[i].d), cy = Y(pts[i].rate);
      gwCtx.beginPath();
      gwCtx.moveTo(cx - r, cy - r); gwCtx.lineTo(cx + r, cy + r);
      gwCtx.moveTo(cx + r, cy - r); gwCtx.lineTo(cx - r, cy + r);
      gwCtx.stroke();
    }
  }

  /* ---- Count rate vs 1/d^2: the inverse-square TEST. Plots background-
     corrected count rate against 1/d^2 using the MEASURED distance d (no epsilon
     correction - this plot deliberately tests what the raw measured data says).
     A standard least-squares straight line is drawn as the reference: if the
     crosses lie on it, inverse-square holds; systematic departure shows it does
     not, and to what extent. Same style as the other graphs. ---- */
  function gwDrawCRvsInvD2() {
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    const raw = distancePoints();
    const mL = 86, mR = 36, mT = 42, mB = 60;
    const px = mL, py = mT, pw = W - mL - mR, ph = H - mT - mB;

    // build (x = 1/d^2, y = corrected rate); need d > 0
    const pts = [];
    for (let i = 0; i < raw.length; i++) { if (raw[i].d > 0) pts.push({ x: 1 / (raw[i].d * raw[i].d), y: raw[i].rate, sigma: raw[i].sigma }); }

    if (pts.length < 3) {
      gwCtx.fillStyle = '#9fb4c9'; gwCtx.font = '600 16px -apple-system,sans-serif';
      gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle';
      gwCtx.fillText('More than 2 data points needed', W / 2, H / 2 - 12);
      gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '14px -apple-system,sans-serif';
      gwCtx.fillText('Take readings at three or more different distances.', W / 2, H / 2 + 12);
      return;
    }

    let xMax = 0, yMax = 1;
    for (let i = 0; i < pts.length; i++) { if (pts[i].x > xMax) xMax = pts[i].x; if (pts[i].y > yMax) yMax = pts[i].y; }
    const xTop = xMax * 1.08, yTop = yMax * 1.08;

    function X(v) { return px + (v / xTop) * pw; }
    function Y(v) { return py + ph - (v / yTop) * ph; }

    // standard least-squares line y = a + b x
    let n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sx += pts[i].x; sy += pts[i].y; sxx += pts[i].x * pts[i].x; sxy += pts[i].x * pts[i].y; }
    const denom = n * sxx - sx * sx;
    let b = 0, a = 0, haveFit = false;
    if (Math.abs(denom) > 1e-12) { b = (n * sxy - sx * sy) / denom; a = (sy - b * sx) / n; haveFit = true; }

    // gridlines + axes
    gwCtx.strokeStyle = 'rgba(255,255,255,0.06)'; gwCtx.lineWidth = 1;
    for (let g = 1; g <= 5; g++) { const gy = py + (g / 5) * ph; gwCtx.beginPath(); gwCtx.moveTo(px, gy); gwCtx.lineTo(px + pw, gy); gwCtx.stroke(); }
    gwCtx.strokeStyle = 'rgba(255,255,255,0.35)'; gwCtx.lineWidth = 2;
    gwCtx.beginPath(); gwCtx.moveTo(px, py - 6); gwCtx.lineTo(px, py + ph); gwCtx.lineTo(px + pw + 6, py + ph); gwCtx.stroke();

    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1'; gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle';
    for (let g = 0; g <= 5; g++) { const v = yTop * g / 5; const ty = py + ph - (g / 5) * ph; gwCtx.fillText(fmtTick(v, yTop), px - 9, ty); }
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top';
    const xStep = niceStepG(xTop, 6);
    for (let xv = 0; xv <= xTop + 1e-12; xv += xStep) { gwCtx.fillText(xv.toFixed(xv < 0.1 ? 3 : 2), X(xv), py + ph + 9); }
    gwCtx.fillStyle = 'rgba(255,255,255,0.92)'; gwCtx.font = 'italic 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillText('1 / distance\u00b2  (cm\u207B\u00b2)', px + pw / 2, py + ph + 32);
    gwCtx.save(); gwCtx.translate(px - 60, py + ph / 2); gwCtx.rotate(-Math.PI / 2);
    gwCtx.textBaseline = 'middle'; gwCtx.fillText('count rate / s\u207B\u00B9', 0, 0); gwCtx.restore();

    // notices: fair-testing + missing background
    gwDistanceNotices(px, pw);

    // least-squares straight line across the plotted x-range
    if (haveFit) {
      const x0 = 0, x1 = xTop;
      let y0 = a + b * x0, y1 = a + b * x1;
      // clip the drawn segment to the visible y-range so it never leaves the panel
      gwCtx.save();
      gwCtx.beginPath(); gwCtx.rect(px, py, pw, ph); gwCtx.clip();
      gwCtx.strokeStyle = '#fbbf24'; gwCtx.lineWidth = 2.4;
      gwCtx.beginPath(); gwCtx.moveTo(X(x0), Y(y0)); gwCtx.lineTo(X(x1), Y(y1)); gwCtx.stroke();
      gwCtx.restore();
    }

    // counting-uncertainty error bars (under the crosses)
    if (showUncert) {
      for (let i = 0; i < pts.length; i++) {
        const ex = X(pts[i].x);
        gwErrorBar(ex, Y(pts[i].y + pts[i].sigma), Y(pts[i].y - pts[i].sigma), py, py + ph, 'rgba(52,211,153,0.7)');
      }
      gwUncertCaption(px, py, pw);
    }

    // data crosses (identical style to the other graphs)
    gwCtx.strokeStyle = '#34d399'; gwCtx.lineWidth = 2.2; const r = 5;
    for (let i = 0; i < pts.length; i++) {
      const cx = X(pts[i].x), cy = Y(pts[i].y);
      gwCtx.beginPath();
      gwCtx.moveTo(cx - r, cy - r); gwCtx.lineTo(cx + r, cy + r);
      gwCtx.moveTo(cx + r, cy - r); gwCtx.lineTo(cx - r, cy + r);
      gwCtx.stroke();
    }
  }

  /* ---- 1/sqrt(count rate) vs distance: the inverse-square LINEARISATION with
     apparatus-offset recovery. For C = k/(d+eps)^2, 1/sqrt(C) = (d+eps)/sqrt(k),
     a straight line in measured d whose x-intercept is -eps. So extrapolating
     the least-squares line back to 1/sqrt(C)=0 reads the apparatus offset eps
     straight off the d-axis. For gamma the points are straight and eps comes out
     ~2 cm; for beta the points CURVE (air attenuation breaks the k/(d+eps)^2
     form) and the straight-line intercept is meaningless - the curvature is the
     honest signal it is not pure inverse-square. Same style as the other graphs;
     the eps working is drawn on canvas like the half-life working. ---- */
  function gwDrawInvSqrtC() {
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    const raw = distancePoints();
    const mL = 86, mR = 36, mT = 42, mB = 60;
    const px = mL, py = mT, pw = W - mL - mR, ph = H - mT - mB;

    const pts = [];
    for (let i = 0; i < raw.length; i++) {
      if (raw[i].d > 0 && raw[i].rate > 0) {
        // y = C^(-1/2)  =>  sigma_y = sigma_C / (2 C^(3/2))
        const sy2 = raw[i].sigma / (2 * Math.pow(raw[i].rate, 1.5));
        pts.push({ d: raw[i].d, y: 1 / Math.sqrt(raw[i].rate), sigmaY: sy2 });
      }
    }

    if (pts.length < 3) {
      gwCtx.fillStyle = '#9fb4c9'; gwCtx.font = '600 16px -apple-system,sans-serif';
      gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle';
      gwCtx.fillText('More than 2 data points needed', W / 2, H / 2 - 12);
      gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '14px -apple-system,sans-serif';
      gwCtx.fillText('Take readings at three or more different distances.', W / 2, H / 2 + 12);
      return;
    }

    // least-squares line y = a + b d
    let n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) { sx += pts[i].d; sy += pts[i].y; sxx += pts[i].d * pts[i].d; sxy += pts[i].d * pts[i].y; }
    const denom = n * sxx - sx * sx;
    let b = 0, a = 0, haveFit = false, xIntercept = 0;
    if (Math.abs(denom) > 1e-12) { b = (n * sxy - sx * sy) / denom; a = (sy - b * sx) / n; haveFit = true; if (Math.abs(b) > 1e-12) xIntercept = -a / b; }

    // axis ranges. x extends into NEGATIVE d so the x-intercept (= -eps) shows.
    let dMax = 0, yMax = 0;
    for (let i = 0; i < n; i++) { if (pts[i].d > dMax) dMax = pts[i].d; if (pts[i].y > yMax) yMax = pts[i].y; }
    const dMin = -4;                          // show back to -4 cm for the intercept
    dMax = dMax * 1.05;
    const yTop = yMax * 1.10;
    const xSpan = dMax - dMin;

    function X(d) { return px + ((d - dMin) / xSpan) * pw; }
    function Y(v) { return py + ph - (v / yTop) * ph; }

    // gridlines
    gwCtx.strokeStyle = 'rgba(255,255,255,0.06)'; gwCtx.lineWidth = 1;
    for (let g = 1; g <= 5; g++) { const gy = py + (g / 5) * ph; gwCtx.beginPath(); gwCtx.moveTo(px, gy); gwCtx.lineTo(px + pw, gy); gwCtx.stroke(); }
    // axes: y-axis sits at d = 0 (not the panel's left edge, since x goes negative)
    const xZero = X(0);
    gwCtx.strokeStyle = 'rgba(255,255,255,0.35)'; gwCtx.lineWidth = 2;
    gwCtx.beginPath(); gwCtx.moveTo(xZero, py - 6); gwCtx.lineTo(xZero, py + ph); gwCtx.stroke();      // y-axis at d=0
    gwCtx.beginPath(); gwCtx.moveTo(px, py + ph); gwCtx.lineTo(px + pw + 6, py + ph); gwCtx.stroke();  // x-axis (1/sqrtC = 0)

    // y labels
    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1'; gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle';
    for (let g = 0; g <= 5; g++) { const v = yTop * g / 5; const ty = py + ph - (g / 5) * ph; gwCtx.fillText(v.toFixed(3), xZero - 9, ty); }
    // x labels (including negatives)
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top';
    const xStep = niceStepG(dMax, 7);
    for (let dv = Math.ceil(dMin / xStep) * xStep; dv <= dMax + 1e-9; dv += xStep) {
      gwCtx.fillStyle = (Math.abs(dv) < 1e-9) ? '#cbd5e1' : '#cbd5e1';
      gwCtx.fillText(dv.toFixed(0), X(dv), py + ph + 9);
    }
    gwCtx.fillStyle = 'rgba(255,255,255,0.92)'; gwCtx.font = 'italic 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillText('distance / cm', px + pw / 2, py + ph + 32);
    gwCtx.save(); gwCtx.translate(px - 60, py + ph / 2); gwCtx.rotate(-Math.PI / 2);
    gwCtx.textBaseline = 'middle'; gwCtx.fillText('1 / \u221a(count rate)', 0, 0); gwCtx.restore();

    // notices: fair-testing + missing background
    gwDistanceNotices(px, pw);

    // least-squares line, drawn from the x-intercept across to dMax
    if (haveFit) {
      const xa = Math.max(dMin, Math.min(xIntercept, dMax)), xb = dMax;
      gwCtx.save();
      gwCtx.beginPath(); gwCtx.rect(px, py, pw, ph); gwCtx.clip();
      gwCtx.strokeStyle = '#fbbf24'; gwCtx.lineWidth = 2.4;
      gwCtx.beginPath(); gwCtx.moveTo(X(dMin), Y(a + b * dMin)); gwCtx.lineTo(X(dMax), Y(a + b * dMax)); gwCtx.stroke();
      gwCtx.restore();
      // mark the x-intercept where the line crosses 1/sqrtC = 0
      if (xIntercept > dMin && xIntercept < dMax) {
        gwCtx.beginPath(); gwCtx.arc(X(xIntercept), Y(0), 7, 0, Math.PI * 2);
        gwCtx.fillStyle = '#fb923c'; gwCtx.shadowColor = '#fb923c'; gwCtx.shadowBlur = 10; gwCtx.fill(); gwCtx.shadowBlur = 0;
        gwCtx.lineWidth = 2; gwCtx.strokeStyle = '#fff'; gwCtx.stroke();
        gwCtx.fillStyle = '#fdba74'; gwCtx.font = 'bold 14px -apple-system,BlinkMacSystemFont,"Segoe UI"';
        gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'bottom';
        gwCtx.fillText('d = ' + xIntercept.toFixed(1), X(xIntercept), Y(0) - 10);
      }
      // eps working on canvas (lower area, clear of the y-axis labels)
      const eps = -xIntercept;
      gwCtx.textAlign = 'left'; gwCtx.textBaseline = 'alphabetic';
      const bx = px + pw - 340, by = py + ph - 96;
      gwCtx.font = 'bold 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#e5e7eb';
      gwCtx.fillText('x-intercept: 1/\u221aC = 0 at d = \u2212\u03b5', bx, by);
      gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#cbd5e1';
      gwCtx.fillText('so \u03b5 = \u2212(' + xIntercept.toFixed(1) + ') cm', bx, by + 24);
      gwCtx.font = 'bold 17px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#fbbf24';
      gwCtx.fillText('\u03b5 = ' + eps.toFixed(1) + ' cm   (true offset ' + state.epsCm.toFixed(1) + ' cm)', bx, by + 50);
    }

    // counting-uncertainty error bars (under the crosses)
    if (showUncert) {
      for (let i = 0; i < n; i++) {
        const ex = X(pts[i].d);
        gwErrorBar(ex, Y(pts[i].y + pts[i].sigmaY), Y(pts[i].y - pts[i].sigmaY), py, py + ph, 'rgba(52,211,153,0.7)');
      }
      gwUncertCaption(px, py, pw);
    }

    // data crosses
    gwCtx.strokeStyle = '#34d399'; gwCtx.lineWidth = 2.2; const r = 5;
    for (let i = 0; i < n; i++) {
      const cx = X(pts[i].d), cy = Y(pts[i].y);
      gwCtx.beginPath();
      gwCtx.moveTo(cx - r, cy - r); gwCtx.lineTo(cx + r, cy + r);
      gwCtx.moveTo(cx + r, cy - r); gwCtx.lineTo(cx - r, cy + r);
      gwCtx.stroke();
    }
  }

  /* ---- Count rate (bars): one bar per single reading (raw, uncorrected count
     rate), background included as its own bar, repeats kept as separate bars.
     Repeats of one absorber show the counting scatter; different absorbers show
     the absorption. Only drawn when the readings share the same source, distance
     and gate (a fair set); otherwise a message states what is required.
     Categorical x-axis, so bars (not points/curve). Makes no fit or claim. ---- */
  function gwDrawAbsorberBars() {
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    const mL = 86, mR = 36, mT = 36, mB = 88;
    const px = mL, py = mT, pw = W - mL - mR, ph = H - mT - mB;

    const data = absorberBarData();
    if (!data.ok) {
      gwCtx.fillStyle = '#9fb4c9'; gwCtx.font = '600 16px -apple-system,sans-serif';
      gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle';
      let msg = 'Nothing to show yet', sub = '';
      if (data.reason === 'few') { msg = 'Take at least two readings'; sub = 'Repeat a reading, or change the absorber, keeping source and distance fixed.'; }
      else if (data.reason === 'varied') { msg = 'Keep source and distance fixed'; sub = 'Absorber and gate may change; bars compare one source at one distance.'; }
      gwCtx.fillText(msg, W / 2, H / 2 - 12);
      gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '14px -apple-system,sans-serif';
      gwCtx.fillText(sub, W / 2, H / 2 + 12);
      return;
    }

    const bars = data.bars;
    let rMax = 1;
    for (let i = 0; i < bars.length; i++) {
      const top = bars[i].rate + (showUncert ? (bars[i].sigma || 0) : 0);
      if (top > rMax) rMax = top;
    }
    const yTop = rMax * (showUncert ? 1.18 : 1.12);   // extra headroom for the % line

    function Y(v) { return py + ph - (v / yTop) * ph; }

    // gridlines + axes
    gwCtx.strokeStyle = 'rgba(255,255,255,0.06)'; gwCtx.lineWidth = 1;
    for (let g = 1; g <= 5; g++) { const gy = py + (g / 5) * ph; gwCtx.beginPath(); gwCtx.moveTo(px, gy); gwCtx.lineTo(px + pw, gy); gwCtx.stroke(); }
    gwCtx.strokeStyle = 'rgba(255,255,255,0.35)'; gwCtx.lineWidth = 2;
    gwCtx.beginPath(); gwCtx.moveTo(px, py - 6); gwCtx.lineTo(px, py + ph); gwCtx.lineTo(px + pw + 6, py + ph); gwCtx.stroke();

    // y labels + axis title (1 dp when the scale is small, else whole numbers,
    // so low-rate repeat charts don't show duplicate rounded labels)
    const yDp = (yTop < 10) ? 1 : 0;
    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1'; gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle';
    for (let g = 0; g <= 5; g++) { const v = yTop * g / 5; const ty = py + ph - (g / 5) * ph; gwCtx.fillText(v.toFixed(yDp), px - 9, ty); }
    gwCtx.save(); gwCtx.translate(px - 60, py + ph / 2); gwCtx.rotate(-Math.PI / 2);
    gwCtx.fillStyle = 'rgba(255,255,255,0.92)'; gwCtx.font = 'italic 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle'; gwCtx.fillText('count rate / s\u207B\u00B9', 0, 0); gwCtx.restore();

    // background reference line across the plot (the floor). The labelled
    // background bar already names it, so the line itself needs no text.
    if (data.bgRate !== null && data.bgRate > 0) {
      const by = Y(data.bgRate);
      gwCtx.strokeStyle = 'rgba(251,191,36,0.5)'; gwCtx.lineWidth = 1.5; gwCtx.setLineDash([6, 4]);
      gwCtx.beginPath(); gwCtx.moveTo(px, by); gwCtx.lineTo(px + pw, by); gwCtx.stroke();
      gwCtx.setLineDash([]);
    }

    // bars
    const n = bars.length;
    const slot = pw / n;
    const bw = Math.min(slot * 0.62, 70);
    for (let i = 0; i < n; i++) {
      const cx = px + slot * (i + 0.5);
      const bh = (bars[i].rate / yTop) * ph;
      const bx = cx - bw / 2, byTop = py + ph - bh;
      // background bar dimmer/distinct from absorber bars
      gwCtx.fillStyle = bars[i].isBg ? 'rgba(148,163,184,0.55)' : 'rgba(52,211,153,0.75)';
      gwCtx.strokeStyle = bars[i].isBg ? 'rgba(148,163,184,0.9)' : '#34d399';
      gwCtx.lineWidth = 1.5;
      gwCtx.fillRect(bx, byTop, bw, bh);
      gwCtx.strokeRect(bx, byTop, bw, bh);
      // counting-uncertainty whisker (light, so it reads on the filled bar)
      let labelY = byTop;
      if (showUncert && bars[i].sigma > 0) {
        const wTop = Y(bars[i].rate + bars[i].sigma), wBot = Y(Math.max(0, bars[i].rate - bars[i].sigma));
        gwErrorBar(cx, wTop, wBot, py, py + ph, 'rgba(229,231,235,0.85)');
        labelY = Math.min(labelY, Math.max(wTop, py));
      }
      // value above the bar (above the whisker when uncertainties are shown),
      // with the percentage uncertainty beneath it: sigma/rate = sqrt(N)/N,
      // the standard percentage-uncertainty formula for a count of N.
      gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'bottom';
      if (showUncert && bars[i].sigma > 0 && bars[i].rate > 0) {
        const pct = 100 * bars[i].sigma / bars[i].rate;
        gwCtx.fillStyle = '#e5e7eb'; gwCtx.font = '12px -apple-system,sans-serif';
        gwCtx.fillText('\u00b1' + (pct < 10 ? pct.toFixed(1) : pct.toFixed(0)) + '%', cx, labelY - 4);
        gwCtx.font = '600 13px -apple-system,sans-serif';
        gwCtx.fillText(bars[i].rate < 10 ? bars[i].rate.toFixed(1) : bars[i].rate.toFixed(0), cx, labelY - 19);
      } else {
        gwCtx.fillStyle = '#e5e7eb'; gwCtx.font = '600 12px -apple-system,sans-serif';
        gwCtx.fillText(bars[i].rate < 10 ? bars[i].rate.toFixed(1) : bars[i].rate.toFixed(0), cx, labelY - 4);
      }
      // label below the axis (angled if many bars)
      gwCtx.save();
      gwCtx.translate(cx, py + ph + 10);
      gwCtx.fillStyle = bars[i].isBg ? '#9fb4c9' : '#cbd5e1';
      gwCtx.font = '13px -apple-system,sans-serif';
      if (n > 5) { gwCtx.rotate(-Math.PI / 6); gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle'; gwCtx.fillText(bars[i].label, 0, 0); }
      else { gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top'; gwCtx.fillText(bars[i].label, 0, 0); }
      gwCtx.restore();
    }
    if (showUncert) gwUncertCaption(px, py, pw);
  }

  /* ---- Count distribution: histogram of repeat counts at one fixed setup,
     with the Poisson prediction drawn as a dashed normal curve of mean N-bar
     and width sqrt(N-bar), scaled to the number of readings. The on-canvas
     working compares the observed spread s with the predicted sqrt(mean):
     "decay is random" made quantitative and checkable. ---- */
  function gwDrawHist() {
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    const mL = 86, mR = 36, mT = 36, mB = 60;
    const px = mL, py = mT, pw = W - mL - mR, ph = H - mT - mB;

    const data = histGroupData();
    if (!data.ok) {
      gwCtx.fillStyle = '#9fb4c9'; gwCtx.font = '600 16px -apple-system,sans-serif';
      gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'middle';
      gwCtx.fillText('Repeat one reading 5 or more times', W / 2, H / 2 - 12);
      gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '14px -apple-system,sans-serif';
      gwCtx.fillText('Keep the source, distance, absorber and gate the same between readings.', W / 2, H / 2 + 12);
      return;
    }

    const g = data.group, cs = g.counts, n = cs.length;
    let sum = 0;
    for (let i = 0; i < n; i++) sum += cs[i];
    const mean = sum / n;
    let ss = 0;
    for (let i = 0; i < n; i++) ss += (cs[i] - mean) * (cs[i] - mean);
    const s = Math.sqrt(ss / (n - 1));         // observed sample spread
    const pred = Math.sqrt(mean);              // Poisson prediction

    // integer-aligned bins, about 10 across the data
    let cMin = cs[0], cMax = cs[0];
    for (let i = 1; i < n; i++) { if (cs[i] < cMin) cMin = cs[i]; if (cs[i] > cMax) cMax = cs[i]; }
    const binW = Math.max(1, niceStepG(Math.max(cMax - cMin, 1), 10));
    const start = Math.floor(cMin / binW) * binW;
    const nb = Math.max(1, Math.ceil((cMax + 1 - start) / binW));
    const freq = [];
    for (let b = 0; b < nb; b++) freq.push(0);
    for (let i = 0; i < n; i++) {
      let b = Math.floor((cs[i] - start) / binW);
      if (b < 0) b = 0; if (b > nb - 1) b = nb - 1;
      freq[b]++;
    }
    let fMax = 1;
    for (let b = 0; b < nb; b++) if (freq[b] > fMax) fMax = freq[b];
    // include the curve peak in the y-scale so it never clips
    const peak = n * binW / (pred * Math.sqrt(2 * Math.PI));
    if (peak > fMax) fMax = peak;
    const yTop = fMax * 1.15;
    const xLo = start, xHi = start + nb * binW;

    function X(c) { return px + ((c - xLo) / (xHi - xLo)) * pw; }
    function Y(f) { return py + ph - (f / yTop) * ph; }

    // gridlines + axes
    gwCtx.strokeStyle = 'rgba(255,255,255,0.06)'; gwCtx.lineWidth = 1;
    for (let gl = 1; gl <= 5; gl++) { const gy = py + (gl / 5) * ph; gwCtx.beginPath(); gwCtx.moveTo(px, gy); gwCtx.lineTo(px + pw, gy); gwCtx.stroke(); }
    gwCtx.strokeStyle = 'rgba(255,255,255,0.35)'; gwCtx.lineWidth = 2;
    gwCtx.beginPath(); gwCtx.moveTo(px, py - 6); gwCtx.lineTo(px, py + ph); gwCtx.lineTo(px + pw + 6, py + ph); gwCtx.stroke();

    // y labels (whole readings) + axis titles
    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1'; gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle';
    const yStep = Math.max(1, niceStepG(yTop, 5));
    for (let v = 0; v <= yTop + 1e-9; v += yStep) gwCtx.fillText(v.toFixed(0), px - 9, Y(v));
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top';
    const xStep = Math.max(binW, niceStepG(xHi - xLo, 8));
    for (let xv = xLo; xv <= xHi + 1e-9; xv += xStep) gwCtx.fillText(xv.toFixed(0), X(xv), py + ph + 9);
    gwCtx.fillStyle = 'rgba(255,255,255,0.92)'; gwCtx.font = 'italic 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillText('counts in one gate', px + pw / 2, py + ph + 32);
    gwCtx.save(); gwCtx.translate(px - 60, py + ph / 2); gwCtx.rotate(-Math.PI / 2);
    gwCtx.textBaseline = 'middle'; gwCtx.fillText('number of readings', 0, 0); gwCtx.restore();

    // histogram bars
    for (let b = 0; b < nb; b++) {
      if (!freq[b]) continue;
      const bx = X(start + b * binW), bx2 = X(start + (b + 1) * binW);
      const byTop = Y(freq[b]);
      gwCtx.fillStyle = 'rgba(52,211,153,0.55)';
      gwCtx.strokeStyle = '#34d399'; gwCtx.lineWidth = 1.5;
      gwCtx.fillRect(bx + 1, byTop, bx2 - bx - 2, py + ph - byTop);
      gwCtx.strokeRect(bx + 1, byTop, bx2 - bx - 2, py + ph - byTop);
    }

    // Poisson prediction: dashed normal, mean N-bar, width sqrt(N-bar),
    // scaled to n readings x bin width so curve and bars are comparable
    gwCtx.save();
    gwCtx.beginPath(); gwCtx.rect(px, py, pw, ph); gwCtx.clip();
    gwCtx.strokeStyle = '#fbbf24'; gwCtx.lineWidth = 2.2; gwCtx.setLineDash([7, 5]);
    gwCtx.beginPath();
    for (let q = 0; q <= 240; q++) {
      const c = xLo + (xHi - xLo) * q / 240;
      const f = n * binW * Math.exp(-(c - mean) * (c - mean) / (2 * mean)) / (pred * Math.sqrt(2 * Math.PI));
      if (q === 0) gwCtx.moveTo(X(c), Y(f)); else gwCtx.lineTo(X(c), Y(f));
    }
    gwCtx.stroke();
    gwCtx.setLineDash([]);
    gwCtx.restore();

    // setup caption (top-left): what these repeats are
    let meta = n + ' readings \u00b7 ' + (g.isBackground ? 'background' : g.sourceName) + ' \u00b7 gate ' + g.gate + ' s';
    if (!g.isBackground) {
      meta += ' \u00b7 ' + g.distance.toFixed(1) + ' cm';
      if (g.absorber && g.absorber !== 'none') meta += ' \u00b7 ' + (ABSORBER_LABEL[g.absorber] || g.absorber);
    }
    gwCtx.fillStyle = '#9aa7bd'; gwCtx.font = '12px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.textAlign = 'left'; gwCtx.textBaseline = 'bottom';
    gwCtx.fillText(meta, px, py - 8);

    // the working: observed spread vs Poisson prediction
    const bx0 = px + pw - 250, by0 = py + 26;
    gwCtx.textAlign = 'left'; gwCtx.textBaseline = 'alphabetic';
    gwCtx.font = 'bold 15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#e5e7eb';
    gwCtx.fillText('mean count  N\u0304 = ' + mean.toFixed(1), bx0, by0);
    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1';
    gwCtx.fillText('observed spread  s = ' + s.toFixed(1), bx0, by0 + 24);
    gwCtx.font = 'bold 15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#fbbf24';
    gwCtx.fillText('predicted  \u221aN\u0304 = ' + pred.toFixed(1), bx0, by0 + 48);
  }

  /* ---- ln(count rate) vs time: straight-line fit with the full lambda and
     half-life working drawn on the canvas (Dice Decay gwDrawLn style). ---- */
  function gwDrawLn() {
    const W = graphsCanvas.width, H = graphsCanvas.height;
    gwCtx.setTransform(1, 0, 0, 1, 0, 0);
    gwCtx.fillStyle = '#0c1426'; gwCtx.fillRect(0, 0, W, H);
    const mL = 86, mR = 36, mT = 30, mB = 60;
    const px = mL, py = mT, pw = W - mL - mR, ph = H - mT - mB;

    const sp = seriesPoints();
    const pts = [];
    for (let i = 0; i < sp.length; i++) pts.push({ x: sp[i].t, y: Math.log(sp[i].rate), sLn: sp[i].sigma / sp[i].rate });

    let tMax = 5, yTop = 1; const yMin = 0;
    for (let i = 0; i < pts.length; i++) { if (pts[i].x > tMax) tMax = pts[i].x; if (pts[i].y > yTop) yTop = pts[i].y; }
    tMax = tMax * 1.05; yTop = yTop * 1.08;

    function X(t) { return px + (t / tMax) * pw; }
    function Y(l) { return py + ph - ((l - yMin) / (yTop - yMin)) * ph; }

    gwCtx.strokeStyle = 'rgba(255,255,255,0.06)'; gwCtx.lineWidth = 1;
    for (let g = 1; g <= 5; g++) { const gy = py + (g / 5) * ph; gwCtx.beginPath(); gwCtx.moveTo(px, gy); gwCtx.lineTo(px + pw, gy); gwCtx.stroke(); }
    gwCtx.strokeStyle = 'rgba(255,255,255,0.35)'; gwCtx.lineWidth = 2;
    gwCtx.beginPath(); gwCtx.moveTo(px, py - 6); gwCtx.lineTo(px, py + ph); gwCtx.lineTo(px + pw + 6, py + ph); gwCtx.stroke();

    gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillStyle = '#cbd5e1'; gwCtx.textAlign = 'right'; gwCtx.textBaseline = 'middle';
    for (let g = 0; g <= 5; g++) { const v = yMin + (yTop - yMin) * g / 5; const ty = py + ph - (g / 5) * ph; gwCtx.fillText(v.toFixed(1), px - 9, ty); }
    gwCtx.textAlign = 'center'; gwCtx.textBaseline = 'top';
    const xStep = niceStepG(tMax, 8);
    for (let tv = 0; tv <= tMax + 1e-9; tv += xStep) { gwCtx.fillText(tv.toFixed(0), X(tv), py + ph + 9); }
    gwCtx.fillStyle = 'rgba(255,255,255,0.92)'; gwCtx.font = 'italic 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
    gwCtx.fillText('time / s', px + pw / 2, py + ph + 32);
    gwCtx.save(); gwCtx.translate(px - 60, py + ph / 2); gwCtx.rotate(-Math.PI / 2);
    gwCtx.textBaseline = 'middle'; gwCtx.fillText('ln(count rate)', 0, 0); gwCtx.restore();

    const fit = computeSeriesFit();
    if (fit && pts.length >= 2) {
      const k = fit.k, lnA = Math.log(fit.A);
      const x1 = 0, y1 = lnA;
      const x2 = pts[pts.length - 1].x, y2 = lnA - k * x2;
      gwCtx.strokeStyle = '#fbbf24'; gwCtx.lineWidth = 2.6;
      gwCtx.beginPath(); gwCtx.moveTo(X(x1), Y(y1)); gwCtx.lineTo(X(x2), Y(y2)); gwCtx.stroke();
      const ex = [{ x: x1, y: y1 }, { x: x2, y: y2 }];
      for (let e = 0; e < 2; e++) {
        gwCtx.beginPath(); gwCtx.arc(X(ex[e].x), Y(ex[e].y), 7, 0, Math.PI * 2);
        gwCtx.fillStyle = '#fb923c'; gwCtx.shadowColor = '#fb923c'; gwCtx.shadowBlur = 10; gwCtx.fill(); gwCtx.shadowBlur = 0;
        gwCtx.lineWidth = 2; gwCtx.strokeStyle = '#fff'; gwCtx.stroke();
      }
      gwCtx.font = 'bold 14px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#fdba74'; gwCtx.textAlign = 'left'; gwCtx.textBaseline = 'bottom';
      gwCtx.fillText('(' + x1.toFixed(0) + ', ' + y1.toFixed(2) + ')', X(x1) + 12, Y(y1) - 6);
      const c2 = '(' + x2.toFixed(0) + ', ' + y2.toFixed(2) + ')';
      let c2x = X(x2) + 10; const c2w = gwCtx.measureText(c2).width;
      if (c2x + c2w > px + pw) c2x = px + pw - c2w;
      gwCtx.fillText(c2, c2x, Y(y2) + 22);

      gwCtx.textAlign = 'left'; gwCtx.textBaseline = 'alphabetic';
      const bx = px + 16, by = py + ph - 168;
      gwCtx.font = 'bold 16px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#e5e7eb';
      gwCtx.fillText('gradient = \u2212\u03bb = (y\u2082 \u2212 y\u2081) / (x\u2082 \u2212 x\u2081)', bx, by);
      gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#cbd5e1';
      gwCtx.fillText('= (' + y2.toFixed(2) + ' \u2212 ' + y1.toFixed(2) + ') / (' + x2.toFixed(0) + ' \u2212 ' + x1.toFixed(0) + ')', bx, by + 24);
      gwCtx.fillText('= \u2212' + k.toFixed(4) + ' s\u207B\u00B9', bx, by + 46);
      gwCtx.font = 'bold 17px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#fbbf24';
      gwCtx.fillText('\u03bb = ' + k.toFixed(4) + ' s\u207B\u00B9', bx, by + 74);
      const thalf = Math.LN2 / k;
      gwCtx.font = '15px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#cbd5e1';
      gwCtx.fillText('half-life  t\u00bd = ln2 / \u03bb', bx, by + 100);
      gwCtx.fillText('= 0.693 / ' + k.toFixed(4), bx, by + 122);
      gwCtx.font = 'bold 17px -apple-system,BlinkMacSystemFont,"Segoe UI"';
      gwCtx.fillStyle = '#fbbf24';
      // measured value, with the accepted half-life of the source in brackets
      let measuredLine = '= ' + thalf.toFixed(1) + ' s';
      const decSrc = currentSource();
      if (decSrc && decSrc.decaying && decSrc.halfLife_s) {
        measuredLine += '   (accepted ' + decSrc.halfLife_s + ' s)';
      }
      gwCtx.fillText(measuredLine, bx, by + 146);
    }
    if (showUncert && pts.length) {
      for (let i = 0; i < pts.length; i++) {
        const ex = X(pts[i].x);
        gwErrorBar(ex, Y(pts[i].y + pts[i].sLn), Y(pts[i].y - pts[i].sLn), py, py + ph, 'rgba(52,211,153,0.7)');
      }
      gwUncertCaption(px, py, pw);
    }
    gwCtx.strokeStyle = '#34d399'; gwCtx.lineWidth = 2.2; const r = 5;
    for (let i = 0; i < pts.length; i++) {
      const cx = X(pts[i].x), cy = Y(pts[i].y);
      if (cy < py - 2 || cy > py + ph + 2) continue;
      gwCtx.beginPath();
      gwCtx.moveTo(cx - r, cy - r); gwCtx.lineTo(cx + r, cy + r);
      gwCtx.moveTo(cx + r, cy - r); gwCtx.lineTo(cx - r, cy + r);
      gwCtx.stroke();
    }
    if (pts.length < 2) {
      gwCtx.fillStyle = '#7c8aa3'; gwCtx.font = '15px -apple-system,sans-serif'; gwCtx.textAlign = 'center';
      gwCtx.fillText('Run a timed decay series to see the graph.', px + pw / 2, py + ph / 2);
    }
  }

  /* ---- popout drag + resize (Dice Decay pattern, mouse + touch) ---- */
  function attachPopupDragResize(win, header, grip, onResize) {
    const st = { drag: false, rz: false, sx: 0, sy: 0, wl: 0, wt: 0, rw: 0, rh: 0 };
    function startDrag(cx, cy) { const r = win.getBoundingClientRect(); st.drag = true; st.sx = cx; st.sy = cy; st.wl = r.left; st.wt = r.top; }
    function moveDrag(cx, cy) {
      if (!st.drag) return; let nl = st.wl + (cx - st.sx), nt = st.wt + (cy - st.sy);
      const minL = -(win.offsetWidth - 80), maxL = window.innerWidth - 80; if (nl < minL) nl = minL; if (nl > maxL) nl = maxL;
      if (nt < 0) nt = 0; if (nt > window.innerHeight - 36) nt = window.innerHeight - 36; win.style.left = nl + 'px'; win.style.top = nt + 'px';
    }
    function startResize(cx, cy) { const r = win.getBoundingClientRect(); st.rz = true; st.sx = cx; st.sy = cy; st.rw = r.width; st.rh = r.height; }
    function moveResize(cx, cy) {
      if (!st.rz) return; let nw = st.rw + (cx - st.sx), nh = st.rh + (cy - st.sy);
      if (nw < 380) nw = 380; if (nw > window.innerWidth - 20) nw = window.innerWidth - 20; if (nh < 300) nh = 300; if (nh > window.innerHeight - 20) nh = window.innerHeight - 20;
      win.style.width = nw + 'px'; win.style.height = nh + 'px'; if (onResize) onResize();
    }
    function endAll() { st.drag = false; st.rz = false; }
    header.addEventListener('mousedown', function (e) { if (e.target.tagName === 'BUTTON') return; startDrag(e.clientX, e.clientY); e.preventDefault(); });
    grip.addEventListener('mousedown', function (e) { startResize(e.clientX, e.clientY); e.preventDefault(); });
    document.addEventListener('mousemove', function (e) { if (st.drag) moveDrag(e.clientX, e.clientY); else if (st.rz) moveResize(e.clientX, e.clientY); });
    document.addEventListener('mouseup', endAll);
    header.addEventListener('touchstart', function (e) { if (e.target.tagName === 'BUTTON') return; const t = e.touches[0]; startDrag(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
    grip.addEventListener('touchstart', function (e) { const t = e.touches[0]; startResize(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (e) { if (st.drag) { const t = e.touches[0]; moveDrag(t.clientX, t.clientY); e.preventDefault(); } else if (st.rz) { const t2 = e.touches[0]; moveResize(t2.clientX, t2.clientY); e.preventDefault(); } }, { passive: false });
    document.addEventListener('touchend', endAll);
    document.addEventListener('touchcancel', endAll);
  }
  attachPopupDragResize(graphsWindow, graphsHeader, graphsGrip, drawGraphsWindow);

  graphsBtn.addEventListener('click', () => {
    populateGraphPresets();   // ensure presets match the current mode
    graphsWindow.classList.add('open');
    drawGraphsWindow();
  });
  graphsClose.addEventListener('click', () => { graphsWindow.classList.remove('open'); });
  graphsTypeSel.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;     // ignore unavailable presets
    const btns = graphsTypeSel.querySelectorAll('button');
    for (let i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    btn.classList.add('active');
    graphPreset = btn.getAttribute('data-gtype');
    drawGraphsWindow();
  });
  populateGraphPresets();

  function init() {
    gateSel.value = String(state.gate);
    if (readingsInput) readingsInput.value = String(state.readings);
    renderReveal();
    renderTable();
    setCounter(0, 0, state.gate, false);
    updateEpsEnabled();
    drawBench();
    updateGraphsAvailability();
    requestAnimationFrame(idleLoop);
  }
  init();

  // ---- iPad Safari range-slider touchend fix (from DC Construction Kit) ----
  // On iPad Safari, lifting a finger or Apple Pencil from a range input
  // sometimes gets interpreted as the track origin. The community fix is
  // to recompute the slider value ourselves from the actual touch
  // position and dispatch corrected input/change events.
  //
  // Delegated at document level so it covers any current or future range
  // input - no per-element rebinding needed.
  function _ipadSliderTouchEnd(e) {
    var el = e.target;
    if (!el || el.tagName !== 'INPUT' || el.type !== 'range') return;
    if (el.disabled) return;
    if (!e.changedTouches || e.changedTouches.length === 0) return;
    var t = e.changedTouches[0];
    var rect = el.getBoundingClientRect();
    if (rect.width <= 0) return;
    var min = parseFloat(el.min);
    var max = parseFloat(el.max);
    if (isNaN(min)) min = 0;
    if (isNaN(max)) max = 100;
    var step = parseFloat(el.step);
    if (isNaN(step) || step <= 0) step = 1;
    // Fraction along the track (0 = left, 1 = right). Clamp so a touch
    // that ends just outside the slider bounds still produces an
    // in-range value rather than snapping wildly.
    var frac = (t.clientX - rect.left) / rect.width;
    if (frac < 0) frac = 0;
    if (frac > 1) frac = 1;
    var raw = min + frac * (max - min);
    // Snap to nearest step from min.
    var stepped = min + Math.round((raw - min) / step) * step;
    if (stepped < min) stepped = min;
    if (stepped > max) stepped = max;
    // Avoid floating-point noise like 0.30000000000000004 for step="0.1".
    // toFixed picks decimal places from step's exponent.
    var stepStr = String(step);
    var dotIdx = stepStr.indexOf('.');
    var decimals = (dotIdx >= 0) ? (stepStr.length - dotIdx - 1) : 0;
    var newVal = decimals > 0 ? parseFloat(stepped.toFixed(decimals)) : stepped;
    var current = parseFloat(el.value);
    if (newVal === current) return;  // Browser got it right; don't double-fire.
    el.value = String(newVal);
    // Fire input first (live-update handler) then change (commit handler),
    // mirroring the order a real interaction would produce.
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  document.addEventListener('touchend', _ipadSliderTouchEnd, { passive: true });
  document.addEventListener('touchcancel', _ipadSliderTouchEnd, { passive: true });

})();
</script>
