<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radioactivity Toolkit</title>
<style>
/* ============================================================= *
 * Radioactivity — Nuclear section family theme                  *
 * (matches Dice Decay / SHM / Wave Motion suite colours)        *
 * Self-contained: nothing shared with other suite files.        *
 * ============================================================= */
:root {
  --accent:#34d399; --accent-amber:#fbbf24;
  --alpha:#fb7185; --beta:#38bdf8; --gamma:#a78bfa;
  --bg0:#0a1322; --bg1:#152138;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { -webkit-text-size-adjust:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(160deg,#0a1322,#152138);
  color:#e5e7eb; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:8px 18px 26px;
}
.container {
  background:rgba(8,14,26,0.55); border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:16px 26px 28px; max-width:1180px; width:100%;
  box-shadow:0 18px 60px rgba(0,0,0,0.5);
}
.app-header { text-align:center; margin-bottom:14px; position:relative; }
.app-header h1 {
  font-size:2.05em; font-weight:300; letter-spacing:1px; margin-bottom:4px;
  display:inline-flex; align-items:center; justify-content:center;
}
.app-header .subtitle { font-size:1em; opacity:0.85; font-weight:300; }

/* Tab bar (only one tab built so far; bar present for future modes). */
.tab-bar { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; padding:4px; margin-bottom:16px; }
.main-tab {
  position:relative; padding:11px 24px; border:none;
  background:linear-gradient(145deg,#1c2c46,#13203a); color:#8aa0c0; border-radius:13px; cursor:pointer;
  font-size:0.86em; font-weight:700; text-transform:uppercase; letter-spacing:1.1px;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 4px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.main-tab.active {
  background:linear-gradient(145deg,#0c3a3a,#062525); color:var(--accent);
  transform:translateY(-2px); border:1px solid rgba(52,211,153,0.4);
  box-shadow:0 8px 26px rgba(52,211,153,0.18), inset 0 1px 0 rgba(120,255,200,0.15);
}

/* Bench canvas */
.bench-wrap { position:relative; }
.run-overlay {
  position:absolute; right:22px; bottom:20px;
  min-width:120px; z-index:2;
}
.emission-overlay {
  position:absolute; top:20px; right:22px;
  display:flex; align-items:center; gap:8px;
  background:rgba(10,18,32,0.66); border:1px solid rgba(52,211,153,0.30);
  border-radius:8px; padding:7px 11px;
}
.emission-overlay .emission-lbl {
  font-weight:600; font-size:0.62em; text-transform:uppercase; letter-spacing:1.1px; color:#9fd9c2;
}
.emission-overlay .reveal-content { min-width:30px; display:inline-flex; gap:4px; align-items:center; }
.emission-overlay .hidden-q { color:#7c8aa3; font-style:italic; font-size:0.82em; }
#absBench {
  display:block; width:100%; height:360px; border-radius:12px;
  background:radial-gradient(120% 140% at 50% 0%, #14233e 0%, #0a1322 70%);
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset; touch-action:none;
}

/* Counter readout */
.counter-bar {
  display:flex; justify-content:center; align-items:stretch; gap:14px;
  margin:14px 0 4px; flex-wrap:wrap;
}
.counter-box {
  min-width:210px; padding:10px 18px; border-radius:12px;
  background:linear-gradient(135deg,rgba(12,58,58,0.5),rgba(6,37,37,0.6));
  border:1px solid rgba(52,211,153,0.35); text-align:center;
}
.counter-box .lbl { font-size:0.7em; text-transform:uppercase; letter-spacing:1.2px; color:#9fd9c2; }
.counter-box .val {
  font-size:2.0em; font-weight:700; color:var(--accent);
  font-variant-numeric:tabular-nums; line-height:1.15;
}
.counter-box .sub { font-size:0.82em; color:#cbd5e1; font-variant-numeric:tabular-nums; }
.gate-box { min-width:180px; display:flex; flex-direction:column; justify-content:center; }
.gate-progress {
  height:6px; border-radius:4px; background:rgba(255,255,255,0.08); margin-top:8px; overflow:hidden;
}
.gate-progress > div { height:100%; width:0%; background:var(--accent); transition:none; }

/* Reveal panel */
.reveal-box {
  min-width:210px; padding:10px 18px; border-radius:12px;
  background:linear-gradient(135deg,rgba(40,40,70,0.4),rgba(20,20,38,0.55));
  border:1px solid rgba(255,255,255,0.12); text-align:center;
}
.reveal-box .lbl { font-size:0.7em; text-transform:uppercase; letter-spacing:1.2px; color:#b8b8d8; }
.reveal-content { margin-top:6px; font-size:1.05em; font-weight:700; letter-spacing:1px; }
.reveal-content .hidden-q { color:#8aa0c0; font-weight:400; }
.chip { display:inline-block; padding:2px 9px; border-radius:8px; margin:0 3px; font-weight:700; }
.chip.a { background:rgba(251,113,133,0.18); color:var(--alpha); border:1px solid rgba(251,113,133,0.5); }
.chip.b { background:rgba(56,189,248,0.16); color:var(--beta); border:1px solid rgba(56,189,248,0.5); }
.chip.g { background:rgba(167,139,250,0.16); color:var(--gamma); border:1px solid rgba(167,139,250,0.5); }
.chip.none { background:rgba(255,255,255,0.06); color:#9aa7bd; border:1px solid rgba(255,255,255,0.18); }

/* Controls */
.controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:16px 0 6px; }
.control-group {
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:9px 14px;
  background:linear-gradient(135deg,rgba(40,40,70,0.5),rgba(20,20,38,0.65));
  border:1px solid rgba(255,255,255,0.1); border-radius:12px;
  box-shadow:0 4px 14px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
}
.controls label.grp-label { font-weight:600; font-size:0.7em; text-transform:uppercase; letter-spacing:1.1px; color:#b8b8d8; }
select, .num-input {
  font-size:0.92em; font-weight:600; text-align:center; color:#fff;
  background:rgba(10,18,32,0.8); border:1px solid rgba(255,255,255,0.18);
  border-radius:8px; padding:6px 9px; touch-action:manipulation;
}
select { min-width:150px; cursor:pointer; }
input[type="range"] {
  width:150px; touch-action:none; accent-color:var(--accent);
}
.slider-val { font-size:0.86em; color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; }

.seg { display:inline-flex; border:1px solid rgba(255,255,255,0.18); border-radius:8px; overflow:hidden; }
.seg button {
  border:none; background:rgba(10,18,32,0.8); color:#9aa7bd; padding:6px 11px;
  font-size:0.82em; font-weight:700; cursor:pointer; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.seg button.active { background:rgba(52,211,153,0.22); color:var(--accent); }
.seg-help {
  display:inline-flex; align-items:center; justify-content:center;
  width:14px; height:14px; margin-left:5px; border-radius:50%;
  background:rgba(255,255,255,0.14); color:#cbd5e1; font-size:0.72em; font-weight:700;
  cursor:pointer; vertical-align:middle;
}
.seg-help:hover { background:rgba(52,211,153,0.4); color:#fff; }
#absReadingsInput {
  width:64px; min-width:0; text-align:center; padding:6px 8px;
  background:rgba(10,18,32,0.8); color:#e6f1ec; border:1px solid rgba(255,255,255,0.18);
  border-radius:8px; font-size:0.95em; touch-action:manipulation;
}

.run-btn {
  font-size:1.0em; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  padding:12px 28px; border:none; border-radius:12px; cursor:pointer;
  background:linear-gradient(145deg,#0c3a3a,#062525); color:var(--accent);
  border:1px solid rgba(52,211,153,0.5); transition:all 0.2s;
  box-shadow:0 6px 20px rgba(52,211,153,0.15); touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.run-btn:hover { background:rgba(52,211,153,0.2); color:#fff; }
.run-btn:disabled { opacity:0.45; cursor:not-allowed; }
.run-btn.run-monitoring { opacity:0.6; border-style:dashed; }
.ghost-btn {
  font-size:0.82em; font-weight:700; padding:9px 16px; border-radius:10px; cursor:pointer;
  background:rgba(255,255,255,0.05); color:#cbd5e1; border:1px solid rgba(255,255,255,0.18);
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.ghost-btn:hover { background:rgba(255,255,255,0.1); color:#fff; }
.ghost-btn:disabled { opacity:0.4; cursor:not-allowed; }
.ghost-btn:disabled:hover { background:rgba(255,255,255,0.05); color:#cbd5e1; }

/* Results table */
.table-section { margin-top:18px; }
.table-head-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:8px; }
.table-head-row h2 { font-size:0.95em; font-weight:700; text-transform:uppercase; letter-spacing:1.4px; color:var(--accent); }
.unit-toggle-wrap { display:flex; align-items:center; gap:8px; }
.unit-toggle-wrap span { font-size:0.74em; text-transform:uppercase; letter-spacing:1px; color:#9aa7bd; }
.table-wrap {
  max-height:300px; overflow-y:auto; border:1px solid rgba(255,255,255,0.12);
  border-radius:12px; background:linear-gradient(135deg,rgba(40,40,70,0.35),rgba(20,20,38,0.5));
}
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { padding:8px 12px; text-align:center; font-size:0.92em; }
thead th {
  position:sticky; top:0; background:#0c3a3a; color:var(--accent);
  font-size:0.72em; text-transform:uppercase; letter-spacing:1px; font-weight:700;
  border-bottom:1px solid rgba(52,211,153,0.4);
}
tbody tr:nth-child(even) { background:rgba(255,255,255,0.03); }
tbody tr.latest { background:rgba(52,211,153,0.14); }
tbody td.abs-col { font-weight:600; }
.empty-row td { color:#7c8aa3; font-style:italic; padding:20px; }
.tbl-tag { display:inline-block; padding:1px 7px; border-radius:6px; font-size:0.82em; font-weight:700; }
.tbl-tag.paper { background:rgba(255,255,255,0.08); color:#e5e7eb; }
.tbl-tag.al { background:rgba(148,163,184,0.18); color:#cbd5e1; }
.tbl-tag.pb { background:rgba(100,116,139,0.28); color:#e2e8f0; }
.tbl-tag.none { background:rgba(52,211,153,0.12); color:#9fd9c2; }
.row-del {
  background:none; border:none; color:#8aa0c0; cursor:pointer; font-size:1.0em;
  padding:2px 6px; border-radius:6px; touch-action:manipulation;
}
.row-del:hover { color:#fb7185; background:rgba(251,113,133,0.12); }

/* Help button + modal (SHM-style) */
.tab-help-btn {
  width:26px; height:26px; border-radius:50%;
  background:rgba(52,211,153,0.18); border:1px solid rgba(52,211,153,0.4);
  color:var(--accent); font-size:15px; font-weight:bold; cursor:pointer;
  margin-left:10px; transition:all 0.2s; touch-action:manipulation;
  display:inline-flex; align-items:center; justify-content:center; vertical-align:middle;
}
.tab-help-btn:hover { background:rgba(52,211,153,0.4); color:#fff; box-shadow:0 0 10px rgba(52,211,153,0.4); }
.help-modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000;
  justify-content:center; align-items:center; backdrop-filter:blur(3px);
}
.help-modal {
  background:linear-gradient(135deg,#1a2540 0%,#0f1525 100%);
  border:1px solid rgba(52,211,153,0.3); border-radius:12px;
  max-width:580px; max-height:82vh; overflow-y:auto; padding:20px 26px;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}
.help-modal h2 { color:var(--accent); margin:0 0 14px 0; font-size:1.3em; border-bottom:1px solid rgba(52,211,153,0.2); padding-bottom:10px; }
.help-modal h3 { color:#80c0a0; margin:14px 0 6px 0; font-size:1em; }
.help-modal p { color:#b0c0d0; margin:6px 0; font-size:0.9em; line-height:1.5; }
.help-modal .key { color:#facc15; font-weight:600; }
.help-modal .help-note {
  background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.28);
  border-radius:8px; padding:10px 12px; margin:0 0 6px 0;
}
.help-modal .help-note p { color:#9fb4c9; margin:0; font-size:0.85em; line-height:1.5; }
.help-modal .close-btn { float:right; background:none; border:none; color:#ff6666; font-size:21px; cursor:pointer; padding:0 5px; }
.help-modal .close-btn:hover { color:#ff9999; }

.hint { text-align:center; font-size:0.82em; color:#7c8aa3; font-style:italic; margin-top:10px; }
/* graph preset selector (Dice Decay / SHM graphs-type-btn style) */
.graphs-type-selector {
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  justify-content:center; margin-bottom:8px;
}
.graphs-type-btn {
  padding:5px 14px; border-radius:7px; border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.04); color:#bbb; font-size:0.82em;
  font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
.graphs-type-btn:hover {
  background:rgba(52,211,153,0.12); color:#34d399; border-color:rgba(52,211,153,0.35);
}
.graphs-type-btn.active {
  background:rgba(52,211,153,0.22); color:#34d399; border-color:rgba(52,211,153,0.6);
}
.graphs-type-btn.disabled, .graphs-type-btn:disabled {
  opacity:0.35; cursor:not-allowed;
}
.graphs-type-btn.disabled:hover, .graphs-type-btn:disabled:hover {
  background:rgba(255,255,255,0.04); color:#bbb; border-color:rgba(255,255,255,0.15);
}
/* ---- Resizable graph popout (matches Dice Decay / SHM suite) ---- */
.popout-window {
  position: fixed; top: 90px; left: calc(50% - 320px);
  width: 660px; height: 480px; min-width: 380px; min-height: 300px;
  max-width: calc(100vw - 20px); max-height: calc(100vh - 20px);
  background: linear-gradient(145deg, #12122a, #0c1426);
  border: 1px solid rgba(52,211,153,0.5); border-radius: 14px;
  display: none; flex-direction: column;
  box-shadow: 0 24px 70px rgba(0,0,0,0.65); z-index: 950;
  -webkit-user-select: none; user-select: none;
}
.popout-window.open { display: flex; }
.popout-header {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; padding: 9px 12px; cursor: move;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.popout-title { font-size: 0.82em; letter-spacing: 0.5px; color: #34d399; font-weight: 700; }
.popout-body { flex: 1; min-height: 0; padding: 8px 6px 6px; position: relative; overflow: hidden; display:flex; flex-direction:column; }
#absGraphsCanvas { width: 100%; flex:1; min-height:0; display: block; }
.work-close {
  background: none; border: none; color: #aaa; font-size: 16px;
  cursor: pointer; padding: 2px 6px; border-radius: 6px; line-height: 1;
}
.work-close:hover { color: #fff; background: rgba(255,255,255,0.1); }
.popout-resize-grip {
  position: absolute; right: 0; bottom: 0; width: 22px; height: 22px;
  cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 0 6px, rgba(52,211,153,0.55) 6px 7.5px, transparent 7.5px 11px, rgba(52,211,153,0.55) 11px 12.5px, transparent 12.5px 16px, rgba(52,211,153,0.55) 16px 17.5px, transparent 17.5px);
  border-bottom-right-radius: 14px; opacity: 0.7; transition: opacity 0.15s;
}
.popout-resize-grip:hover { opacity: 1; }
</style>
</head>
<body>

<div class="container">

  <div class="app-header">
    <h1>Radioactivity Toolkit
      <button class="tab-help-btn" onclick="showHelpModal('absorption')" title="Help">?</button>
    </h1>
  </div>

  <!-- ===================== ABSORPTION TAB ===================== -->
  <div id="absTab">

    <div class="bench-wrap">
      <canvas id="absBench" width="1120" height="360"></canvas>
      <div class="emission-overlay">
        <span class="emission-lbl">Emission</span>
        <span class="reveal-content" id="absRevealContent"><span class="hidden-q">hidden</span></span>
        <button class="ghost-btn" id="absRevealBtn">Reveal</button>
      </div>
      <button class="run-btn run-overlay" id="absRunBtn">Run</button>
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="grp-label">Source</label>
        <select id="absSourceSel"></select>
      </div>
      <div class="control-group">
        <label class="grp-label">Absorber</label>
        <select id="absAbsorberSel">
          <option value="none">None</option>
          <option value="idpaper">Paper (idealised)</option>
          <option value="paper">Paper (real)</option>
          <option value="al">Aluminium (3 mm)</option>
          <option value="al5">Aluminium (5 cm)</option>
          <option value="pb">Lead (5 cm)</option>
        </select>
      </div>
      <div class="control-group">
        <label class="grp-label">Measurement</label>
        <div class="seg" id="absModeSeg">
          <button data-mode="single" class="active">Single reading <span class="seg-help" data-help="single">?</span></button>
          <button data-mode="time">Count rate vs time <span class="seg-help" data-help="time">?</span></button>
        </div>
      </div>
      <div class="control-group">
        <label class="grp-label">Gate time</label>
        <select id="absGateSel"></select>
      </div>
      <div class="control-group" id="absReadingsGroup" style="display:none;">
        <label class="grp-label">Readings</label>
        <input type="number" id="absReadingsInput" min="2" max="60" step="1" value="12">
      </div>
      <div class="control-group">
        <label class="grp-label">Speed</label>
        <div class="seg" id="absSpeedSeg">
          <button data-speed="1" class="active">&times;1</button>
          <button data-speed="10">&times;10</button>
          <button data-speed="60">&times;60</button>
          <button data-speed="0">Instant</button>
        </div>
      </div>
      <div class="control-group">
        <label class="grp-label">Sound</label>
        <button class="ghost-btn" id="absSoundBtn" aria-pressed="true">&#128266; On</button>
      </div>
      <div class="control-group" title="How far the source's active layer and the tube's detection point sit behind their windows. 2.0 cm matches real school apparatus; 0 is idealised kit with both at the window faces. Locked while readings exist - press Clear to change it.">
        <label class="grp-label">Apparatus offset &epsilon;</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="range" id="absEpsSlider" min="0" max="2" step="0.1" value="2">
          <span class="slider-val" id="absEpsVal">2.0 cm</span>
        </div>
      </div>
    </div>

    <div class="hint">Drag the source, absorber or detector to position them. See <span style="color:var(--accent);cursor:pointer;font-style:normal;" onclick="showHelpModal('absorption')">help</span> for the method.</div>

    <div class="table-section">
      <div class="table-head-row">
        <h2>Results</h2>
        <div class="unit-toggle-wrap">
          <span>Count rate in</span>
          <div class="seg" id="absUnitSeg">
            <button data-unit="s" class="active">per second</button>
            <button data-unit="min">per minute</button>
            <button data-unit="hr">per hour</button>
          </div>
          <button class="ghost-btn" id="absGraphsBtn">Graphs</button>
          <button class="ghost-btn" id="absClearBtn">Clear</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Source</th>
              <th>Distance</th>
              <th>Absorber</th>
              <th>Gate</th>
              <th>Time / s</th>
              <th>Counts</th>
              <th id="absRateHeader">Count rate / s&minus;&sup1;</th>
              <th id="absAdjHeader">Adjusted count rate / s&minus;&sup1;</th>
            </tr>
          </thead>
          <tbody id="absTableBody">
            <tr class="empty-row"><td colspan="9">No runs yet &mdash; press Run to take a measurement.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Help modal -->
<div id="helpModalOverlay" class="help-modal-overlay" onclick="if(event.target===this)closeHelpModal()">
  <div class="help-modal">
    <button class="close-btn" onclick="closeHelpModal()">&times;</button>
    <div id="helpModalContent"></div>
  </div>
</div>

<script>
/* ============================================================= *
 * Help modal (operational guidance only; SHM-suite style).      *
 * Defined top-level so inline onclick can reach it.             *
 * ============================================================= */
function showHelpModal(topic) {
  var c = document.getElementById('helpModalContent');
  if (!c) return;
  if (topic === 'mode-single') {
    c.innerHTML =
      '<h2>Single reading &mdash; Help</h2>' +
      '<div class="help-note"><p>Takes one count over the chosen gate time and adds a single row to the table.</p></div>' +
      '<h3>How to use it</h3>' +
      '<p>Set the source, absorber, distance and gate time, then press <span class="key">Run</span>. The counter counts up to the gate time and logs the total and the count rate.</p>' +
      '<h3>Why use it</h3>' +
      '<p>This is for <span class="key">comparing setups</span> &mdash; one reading at a time. Change the absorber, the distance, or the source between readings and compare the count rates: this is how you identify which radiations a source gives out, and how you measure the inverse-square fall-off with distance.</p>' +
      '<p>Measure the <span class="key">background</span> first (no source), so you can subtract it to get the count rate due to the source.</p>';
    document.getElementById('helpModalOverlay').style.display = 'flex';
    return;
  }
  if (topic === 'mode-time') {
    c.innerHTML =
      '<h2>Count rate vs time &mdash; Help</h2>' +
      '<div class="help-note"><p>Takes several readings at the same setup, one after another, and records how the count rate changes over time.</p></div>' +
      '<h3>How to use it</h3>' +
      '<p>Leave everything fixed (do not move the source or detector). Set the <span class="key">gate time</span> (the length of each reading) and the <span class="key">number of readings</span>, then press <span class="key">Start</span>. The bench takes that many readings back to back and logs each one with its <span class="key">time</span>. Use the <span class="key">Speed</span> control to play it out in real time or to compress the wait.</p>' +
      '<h3>Why use it</h3>' +
      '<p>This is for watching how a count rate <span class="key">changes with time</span>, rather than comparing setups. Two main uses:</p>' +
      '<p><span class="key">Half-life.</span> This mode uses <span class="key">Protactinium-234m</span>, a short-lived source that decays in about a minute. Each timed run begins by measuring the <span class="key">background</span> automatically (with the source absent), then the freshly-separated source decays: its count rate falls with time. Plot the background-corrected rate against time, or its logarithm, to find the half-life.</p>' +
      '<p><span class="key">Showing the random nature of decay.</span> To see how individual readings scatter, use <span class="key">Single reading</span> mode and repeat the same measurement a few times on a steady source - the count fluctuates each time. Greater scatter appears at lower count rates (further away, or weaker signal), demonstrating that the uncertainty depends on the number of counts collected. The <span class="key">Count distribution</span> graph turns those repeats into a histogram and compares the spread with what randomness predicts.</p>' +
      '<p>Remember to measure the <span class="key">background</span> first so it can be subtracted; near the end of a decay the corrected rate heads towards zero only once the background is removed.</p>';
    document.getElementById('helpModalOverlay').style.display = 'flex';
    return;
  }
  c.innerHTML =
    '<h2>Absorption &amp; Identification &mdash; Help</h2>' +
    '<div class="help-note"><p>The count rates are modelled for fresh sealed sources of typical school activity (a few tens of kBq), with any decay chains taken to be in radioactive equilibrium (the daughter products have fully grown in). Real sources read lower as they age &mdash; quickly for short-lived isotopes, slowly for long-lived ones. The distances and absorbers use real physics, and the gamma count rates are scaled to realistic laboratory values.</p></div>' +
    '<h3>What you see</h3>' +
    '<p>A radioactive <span class="key">source</span> on the left, a slot for an <span class="key">absorber</span> in the middle, and a <span class="key">Geiger&ndash;Muller tube</span> with a counter on the right. This is the bench used to find out which radiations a source gives out.</p>' +
    '<h3>The controls</h3>' +
    '<p><span class="key">Moving things</span> &mdash; you can drag all three items along the bench: the <span class="key">source</span>, the <span class="key">detector</span>, and the <span class="key">absorber</span> (drag it by the round handle below it). They behave as solid objects and gently snap to each centimetre, and the distance reads to 0.1&nbsp;cm so you can position them precisely.</p>' +
    '<p><span class="key">Source</span> &mdash; pick an unknown source. What it emits is hidden until you press <span class="key">Reveal</span>.</p>' +
    '<p><span class="key">Absorber</span> &mdash; place nothing, paper, aluminium or lead between the source and the tube. <span class="key">Paper (idealised)</span> is the textbook model: it stops alpha completely and lets all beta and gamma through. <span class="key">Paper (real)</span> behaves as real paper does &mdash; it stops alpha, but also absorbs some of a low-energy (soft) beta, so the count can drop a little more than the simple rule suggests. Switch between the two to see the difference.</p>' +
    '<p><span class="key">Distance</span> &mdash; the source&ndash;tube separation. Keep it the same between readings for a fair test.</p>' +
    '<p><span class="key">Gate time</span> &mdash; how long the counter counts for. Counting for longer gives a steadier reading.</p>' +
    '<p><span class="key">Speed</span> &mdash; how fast the gate plays out on screen. The physics is unchanged; only the waiting is sped up.</p>' +
    '<p><span class="key">Apparatus offset &epsilon;</span> &mdash; how far the source&rsquo;s active layer and the tube&rsquo;s detection point sit recessed behind their windows. The measured distance d runs window to window, so the true source-to-detection separation is d + &epsilon;. At <span class="key">2.0 cm</span> the bench behaves like real school apparatus: the inverse-square graphs bend at small distances and the 1/&radic;(count rate) line points back to the hidden offset. Slide it to <span class="key">0</span> for idealised kit with everything at the window faces, and the offset&rsquo;s signature vanishes from the graphs &mdash; turning the systematic error on and off is the quickest way to show a class what it does to data. With less recess the alpha also reaches slightly further, as it should. The slider is <span class="key">locked while readings exist</span> (so one dataset never mixes two geometries) and unlocks when you press Clear. Even at 0 the fitted line may miss the origin by a millimetre or two: the detector window has real size, so very close in the counts fall slightly below a perfect inverse square.</p>' +
    '<h3>Live monitor mode (have a play first)</h3>' +
    '<p>Tap the round <span class="key">power switch</span> on the counter to switch it into <span class="key">live monitor</span> mode. The counter then runs continuously, like a switched-on Geiger counter: the total climbs and you hear a steady crackle. Move the tube, source or absorber and the counter speeds up or slows down, and the crackle changes &mdash; great for getting a feel for the apparatus before taking proper readings.</p>' +
    '<p>While monitoring, the panel shows <span class="key">LIVE &mdash; monitor &mdash; not recorded</span> and the <span class="key">Run</span> button is switched off. Nothing here is logged. Tap the power switch again to turn monitor mode off; then use <span class="key">Run</span> to take real, recorded measurements.</p>' +
    '<h3>How to use (recorded measurements)</h3>' +
    '<p><span class="key">1.</span> Measure the <span class="key">background</span> first: choose <span class="key">No source</span> and run.</p>' +
    '<p><span class="key">2.</span> Choose a source and run with <span class="key">no absorber</span>.</p>' +
    '<p><span class="key">3.</span> Add <span class="key">paper</span>: a large drop means alpha is present (paper blocks alpha).</p>' +
    '<p><span class="key">4.</span> Swap to <span class="key">aluminium</span>: a further large drop means beta is present.</p>' +
    '<p><span class="key">5.</span> Swap to <span class="key">lead</span>: if a strong count survives paper and aluminium but drops through lead, gamma is present.</p>' +
    '<p><span class="key">For the inverse-square experiment:</span> remove the absorber, keep the source fixed, and take readings at five or more different distances. The distance graphs then light up.</p>' +
    '<h3>Graphs</h3>' +
    '<p>Once you have recorded some readings, press <span class="key">Graphs</span> (above the table) to open a graph window. It can be dragged and resized. The graphs offered <span class="key">depend on what you have measured</span> &mdash; an option only lights up when your readings suit it; the others stay greyed out. This keeps each graph honest: it appears when, and only when, the data can support it.</p>' +
    '<p><span class="key">Show uncertainties</span> &mdash; tick this box (top of the graph window) to add error bars to every graph, showing how confident each reading is. Short gates give big bars, long gates small ones; on the bar chart each bar also gains its percentage uncertainty. Use it to judge whether two readings really differ or are just scatter.</p>' +
    '<p><span class="key">Count rate (bars)</span> &mdash; a bar for each reading, available once you have two or more readings taken at the <span class="key">same source and distance</span>. Repeat one setting to see how the count naturally scatters from reading to reading; or step through <span class="key">no absorber &rarr; paper &rarr; aluminium &rarr; lead</span> to see each radiation being stopped. The gate time may change between readings &mdash; count rate already allows for it, and each bar&rsquo;s uncertainty shows how much a longer gate tightens the reading. The background appears as its own bar and as a dashed line, so you can see how far each reading sits above it. If the source or the distance changes, the bars are not comparable and the graph explains what to fix.</p>' +
    '<p><span class="key">Count distribution</span> &mdash; a histogram showing how repeat readings of the <span class="key">same setup</span> spread out, with the spread that randomness predicts drawn over it as a dashed curve. Repeat one reading 5 or more times, keeping everything fixed. The graph compares the spread of your counts with the prediction; the closer the agreement, the more clearly your data shows that decay is random.</p>' +
    '<p><span class="key">Count rate vs distance</span>, <span class="key">Count rate vs 1/d&sup2;</span> and <span class="key">1/&radic;(count rate) vs distance</span> &mdash; these are for the <span class="key">inverse-square</span> investigation and appear once you have readings at three or more different distances. The first shows the fall-off, the second tests whether it follows an inverse-square law (a straight line if it does), and the third recovers the small distance offset of the apparatus from where the line crosses the axis. If the absorber or source changed between readings, a note warns you to check the table.</p>' +
    '<p><span class="key">Count rate vs time</span> and <span class="key">ln(count rate) vs time</span> &mdash; these appear once a half-life run has been taken. The first shows the decay curve; the second straightens it to a line and works out the half-life on screen.</p>' +
    '<h3>Reading the table</h3>' +
    '<p>Each run adds a row. <span class="key">Counts</span> is the raw total; <span class="key">count rate</span> is counts divided by the gate time. Subtract the background count rate to get the rate due to the source. Once a background has been measured, the <span class="key">Adjusted</span> column shows each reading with the background already subtracted.</p>' +
    '<p>The counts fluctuate each time, like a real detector. Look for <span class="key">significant</span> changes &mdash; bigger than the natural scatter of a few per cent &mdash; not tiny ones.</p>';
  document.getElementById('helpModalOverlay').style.display = 'flex';
}
function closeHelpModal() {
  var ov = document.getElementById('helpModalOverlay');
  if (ov) ov.style.display = 'none';
}
window.showHelpModal = showHelpModal;
window.closeHelpModal = closeHelpModal;
</script>
