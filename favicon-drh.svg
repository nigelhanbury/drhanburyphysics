<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep purple-navy tile gradient, matching the toolkit background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302b63"/>
      <stop offset="0.55" stop-color="#24243e"/>
      <stop offset="1" stop-color="#0f0c29"/>
    </linearGradient>
    <!-- Mint -> cyan for the H -->
    <linearGradient id="hgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffcf"/>
      <stop offset="1" stop-color="#38b6ff"/>
    </linearGradient>
    <!-- Amber for "Dr" -->
    <linearGradient id="drgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#4b4788" stroke-width="1.5"/>

  <!-- Subtle capacitor plates behind the letters (physics motif), pink accent -->
  <g stroke="#ff6b9d" stroke-width="2.4" stroke-linecap="round" opacity="0.42">
    <line x1="20" y1="12" x2="44" y2="12"/>
    <line x1="20" y1="52" x2="44" y2="52"/>
  </g>

  <!-- "Dr" small, amber, upper -->
  <text x="32" y="27" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700"
        text-anchor="middle" fill="url(#drgrad)">Dr</text>

  <!-- "H" large, mint-cyan, lower/dominant -->
  <text x="32" y="52" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800"
        text-anchor="middle" fill="url(#hgrad)">H</text>
</svg>
